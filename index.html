<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>تقييم جاهزية المساجد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E1E1E; --navy:#33957F; --navy-2:#1E1E1E; --brown:#F07E66; --gold:#F79C6D;
  --gold-soft:#FBE6DB; --sand:#FDF6F1; --card:#FFFFFF; --line:#F1E2D9; --muted:#6B6B6B;
  --ok:#33957F; --ok-soft:#E3F1EC; --bad:#E5533D; --bad-soft:#FFE6E0;
  --warn:#E9853F; --warn-soft:#FDEBD9; --na:#8A8F91; --na-soft:#EEF0F0;
  --yellow:#F8B941; --salmon:#FF8A75;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--sand);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.pattern{height:6px;background:var(--gold)}
header.top{background:linear-gradient(90deg,#FAD0BA 0%,#F7A67D 40%,#F79C6D 70%);color:#fff;padding:20px 16px 22px;position:relative;overflow:hidden}
.top-inner{max-width:760px;margin:0 auto;position:relative;z-index:1;display:flex;align-items:center;gap:14px}
.top-inner img{height:46px;flex:none}
.top-inner h1{margin:0;font-size:1.22rem;font-weight:700;line-height:1.35}
.top-inner p{margin:2px 0 0;color:#fff;opacity:.92;font-size:.82rem}

/* sticky step bar */
.stepbar{position:sticky;top:0;z-index:30;background:var(--sand);border-bottom:1px solid var(--line);box-shadow:0 6px 12px -10px rgba(33,29,26,.35)}
.stepbar-inner{max-width:760px;margin:0 auto;padding:10px 14px 9px}
.step-row{display:flex;gap:8px;align-items:center}
.step-select{flex:1;min-width:0;padding:10px 10px;border:1.5px solid var(--navy);border-radius:11px;background:#fff;font-weight:600;font-size:.88rem}
.step-count{flex:none;font-size:.75rem;font-weight:700;color:var(--brown);background:var(--gold-soft);padding:6px 10px;border-radius:20px}
.prog{height:6px;background:#F6E7DE;border-radius:6px;overflow:hidden;margin-top:9px}
.prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--brown));border-radius:6px;transition:width .25s}
.prog-legend{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:3px}

main{max-width:760px;margin:0 auto;padding:16px 14px 120px}

.page-head{margin:4px 0 14px}
.eyebrow{font-size:.75rem;font-weight:700;color:var(--brown);letter-spacing:0}
.page-head h2{margin:2px 0 6px;font-size:1.3rem;font-weight:700;color:var(--navy-2)}
.page-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.mini{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:20px}
.mini.b{background:var(--bad-soft);color:var(--bad)}
.mini.u{background:var(--warn-soft);color:var(--warn)}
.linkbtn{background:none;border:none;color:var(--brown);font-weight:700;font-size:.8rem;text-decoration:underline;padding:4px 0}
.hint{background:var(--gold-soft);border:1px solid #F9CDB6;color:#8A3F2C;border-radius:12px;padding:10px 13px;font-size:.82rem;margin-bottom:14px}

/* element card */
.el{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:11px;overflow:hidden;border-inline-start:5px solid #EBD9CE;box-shadow:0 1px 2px rgba(33,29,26,.04)}
.el.st-ok{border-inline-start-color:var(--ok)}
.el.st-bad{border-inline-start-color:var(--bad)}
.el.st-badu{border-inline-start-color:var(--warn)}
.el.st-badl{border-inline-start-color:#E6A817}
.el.st-partial{border-inline-start-color:var(--gold)}
.el.st-absent{border-inline-start-color:var(--na);opacity:.82}
.el-head{width:100%;display:flex;align-items:center;gap:10px;padding:12px 13px;background:none;border:none;text-align:right}
.el-no{flex:none;min-width:30px;height:30px;padding:0 6px;border-radius:9px;background:var(--gold);color:#fff;font-size:.76rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.el-name{flex:1;min-width:0;font-weight:700;font-size:.95rem;color:var(--navy-2);line-height:1.35}
.el-name small{display:block;font-weight:500;font-size:.72rem;color:var(--muted);margin-top:1px}
.pill{flex:none;font-size:.7rem;font-weight:700;padding:4px 9px;border-radius:20px;background:#F6EEE9;color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.badu{background:var(--warn-soft);color:var(--warn)}
.pill.badl{background:#FEF3D6;color:#A07400}
.pill.partial{background:var(--gold-soft);color:#B5512F}
.pill.absent{background:var(--na-soft);color:var(--na)}
.chev{flex:none;color:var(--gold);transition:transform .2s;font-size:.85rem}
.el.open .chev{transform:rotate(180deg)}
.el-body{display:none;padding:0 13px 14px;border-top:1px solid var(--line)}
.el.open .el-body{display:block}
.el-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0 6px;flex-wrap:wrap}
.sw{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer}
.sw input{width:18px;height:18px;accent-color:var(--navy)}
.okall{border:1.5px solid var(--ok);color:var(--ok);background:var(--ok-soft);font-weight:700;font-size:.78rem;padding:6px 12px;border-radius:20px}
.crit{padding:10px 0;border-bottom:1px dashed var(--line)}
.crit:last-of-type{border-bottom:none}
.crit-label{font-weight:600;font-size:.88rem;margin-bottom:7px;display:flex;gap:7px;align-items:baseline}
.crit-label::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--gold);transform:translateY(-1px)}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.seg button{border:1.5px solid #EBD9CE;background:#fff;border-radius:10px;padding:9px 4px;font-weight:700;font-size:.8rem;color:var(--muted)}
.seg .s-r.on{background:var(--ok);border-color:var(--ok);color:#fff}
.seg .s-n.on{background:var(--bad);border-color:var(--bad);color:#fff}
.seg .s-x.on{background:var(--na);border-color:var(--na);color:#fff}
.imp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;padding:8px 10px;background:#FDF3EE;border-radius:10px}
.imp > span{font-size:.75rem;font-weight:700;color:var(--muted)}
.imp button{border:1.5px solid #EBD9CE;background:#fff;border-radius:20px;padding:5px 11px;font-size:.75rem;font-weight:700;color:var(--muted)}
.imp .i-b.on{background:var(--bad);border-color:var(--bad);color:#fff}
.imp .i-u.on{background:var(--warn);border-color:var(--warn);color:#fff}
.imp .i-l.on{background:#E6A817;border-color:#E6A817;color:#fff}
.imp .need{color:var(--bad);font-size:.72rem;font-weight:700}
.qty{display:grid;grid-template-columns:84px 1fr 1fr;gap:8px;margin-top:10px}
.qty label{display:block;font-size:.78rem;font-weight:700;color:var(--navy-2);margin-bottom:4px}
.qty select,.qty input{width:100%;padding:8px 10px;border:1px solid #EBD9CE;border-radius:10px;background:#fff;font-weight:600;min-width:0}
.note{width:100%;margin-top:10px;padding:9px 11px;border:1px solid #EBD9CE;border-radius:10px;min-height:44px;resize:vertical;background:#FFFDFC;font-size:.85rem}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.ph{position:relative;width:66px;height:66px;border-radius:10px;background-size:cover;background-position:center;border:1px solid var(--line)}
.ph button{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;border:none;background:var(--bad);color:#fff;font-size:.7rem;line-height:22px;padding:0}
.addph{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:66px;padding:0 14px;border:1.5px dashed var(--brown);border-radius:10px;color:var(--brown);font-weight:700;font-size:.78rem;background:#FFF5F0;cursor:pointer}
.addph input{display:none}

/* forms */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:1rem;color:var(--navy-2)}
.field{margin-bottom:12px}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--navy-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid #EBD9CE;border-radius:10px;background:#fff;font-size:.92rem}
.field textarea{min-height:70px;resize:vertical}
.req{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brown);outline-offset:1px}
.hijri{font-size:.78rem;color:var(--brown);font-weight:600;margin-top:4px}
.codechip{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:10px;padding:8px 13px;font-weight:700;font-size:.95rem;direction:ltr}
.codechip small{color:rgba(255,255,255,.85);font-weight:600;font-size:.72rem}
.geo{display:flex;gap:8px}
.geo input{flex:1}
.geo button{flex:none;border:1.5px solid var(--navy);background:#fff;border-radius:10px;padding:0 12px;font-weight:700;font-size:.8rem}
.restore{background:var(--ok-soft);border:1px solid var(--ok);color:#1F6B5A;border-radius:12px;padding:11px 13px;font-size:.83rem;margin-bottom:14px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.restore button{border:1px solid var(--bad);color:var(--bad);background:#fff;border-radius:8px;padding:6px 11px;font-weight:700;font-size:.76rem}
.mapbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mapbox div{background:#FDF5F0;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:.78rem}
.mapbox b{display:block;font-size:.85rem;color:var(--navy-2)}

/* summary */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media (min-width:620px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px}
.kpi .v{font-size:1.7rem;font-weight:700;line-height:1.1;color:var(--navy-2)}
.kpi .l{font-size:.75rem;color:var(--muted);font-weight:600;margin-top:4px}
.kpi.hero{background:var(--navy);border-color:var(--navy);color:#fff}
.kpi.hero .v{color:#fff}
.kpi.hero .l{color:rgba(255,255,255,.9)}
.kpi.b .v{color:var(--bad)}
.secrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:.85rem}
.secrow:last-child{border-bottom:none}
.secrow b{font-weight:700;color:var(--navy-2)}
.secrow .pct{font-weight:700}
.bar{grid-column:1/-1;height:8px;background:#F6E7DE;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.secrow .sub{grid-column:1/-1;font-size:.72rem;color:var(--muted)}
.find{display:block;width:100%;text-align:right;background:#fff;border:1px solid var(--line);border-inline-start:4px solid var(--bad);border-radius:11px;padding:10px 12px;margin-bottom:8px}
.find.u{border-inline-start-color:var(--warn)}
.find.l{border-inline-start-color:#E6A817}
.find.none{border-inline-start-color:var(--muted)}
.find b{font-size:.88rem;color:var(--navy-2)}
.find .where{font-size:.72rem;color:var(--muted);display:block}
.find .what{font-size:.8rem;margin-top:3px}
.grp-title{font-size:.85rem;font-weight:700;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.grp-title .dot{width:10px;height:10px;border-radius:50%}
.warnbox{background:var(--warn-soft);border:1px solid #F5C9A0;color:#9A4B17;border-radius:12px;padding:10px 13px;font-size:.82rem;margin-bottom:12px}
.decs{display:grid;gap:8px}
.dec{display:flex;align-items:center;gap:10px;text-align:right;width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:700;font-size:.95rem}
.dec .ring{width:20px;height:20px;border-radius:50%;border:2px solid #E3CFC3;flex:none}
.dec.on.d-ready{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.dec.on.d-cond{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.dec.on.d-not{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.dec.on .ring{border-color:currentColor;background:currentColor;box-shadow:inset 0 0 0 4px #fff}
.indicator{font-size:.8rem;color:var(--muted);margin:10px 0 0}
.exports{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:13px;border:1.5px solid var(--navy);background:#fff;text-align:right;font-weight:700;font-size:.92rem;color:var(--navy-2)}
.xbtn small{font-weight:500;font-size:.72rem;color:var(--muted)}
.xbtn.primary{background:var(--navy);color:#fff}
.xbtn.primary small{color:rgba(255,255,255,.85)}
.xbtn .ic{font-size:1.2rem}
.xbtn .done{font-size:.7rem;color:var(--ok);font-weight:700}
.xbtn.primary .done{color:#CFF0E5}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tools button,.tools label{border:1px solid #EBD9CE;background:#fff;border-radius:10px;padding:9px 12px;font-weight:600;font-size:.8rem;cursor:pointer}
.tools .danger{color:var(--bad);border-color:#F5BEB3}
.tools input{display:none}

/* bottom bar */
.bottombar{position:fixed;bottom:0;right:0;left:0;z-index:30;background:linear-gradient(180deg,rgba(251,241,231,0),var(--sand) 26%);padding:14px 0 calc(10px + env(safe-area-inset-bottom))}
.bottombar-inner{max-width:760px;margin:0 auto;padding:0 14px;display:flex;gap:10px;align-items:center}
.nb{flex:1;padding:14px;border-radius:13px;font-weight:700;font-size:.95rem;border:1.5px solid var(--navy);background:#fff;color:var(--navy)}
.nb.primary{background:var(--navy);color:#fff}
.nb:disabled{opacity:.3}
.saved{position:fixed;top:8px;left:10px;z-index:40;font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(62,122,85,.92);color:#fff;opacity:0;transition:opacity .3s;pointer-events:none}
.saved.show{opacity:1}
.saved.warn{background:rgba(183,121,31,.95)}
.saved.err{background:rgba(162,62,50,.95)}

.toast{position:fixed;bottom:96px;right:50%;transform:translateX(50%);z-index:60;background:var(--navy-2);color:#fff;padding:11px 17px;border-radius:11px;font-size:.85rem;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast.err{background:var(--bad)}

.overlay{position:fixed;inset:0;z-index:100;background:rgba(20,17,16,.6);display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media (min-width:700px){.sheet{border-radius:20px}}
.sheet h3{margin:0 0 6px;font-size:1.08rem}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:.85rem}
.mbtns{display:grid;gap:9px}
.mbtn{display:block;text-align:center;text-decoration:none;padding:13px;border-radius:12px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;font-size:.92rem}
.mbtn.primary{background:var(--navy);color:#fff}
.mbtn.danger{border-color:var(--bad);color:var(--bad)}
.busy{position:fixed;inset:0;z-index:200;background:rgba(251,241,231,.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:700;color:var(--navy-2)}
.busy.show{display:flex}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--gold-soft);border-top-color:var(--brown);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
pre.code{direction:ltr;text-align:left;background:#FDF3EE;border-radius:10px;padding:10px;font-size:.72rem;overflow:auto}

/* ============ REPORT (PDF) ============ */
#pdfHost{position:absolute;top:0;left:0;width:794px;z-index:150;pointer-events:none}
.rp-measure,.rp-page{font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;direction:rtl;color:#1E1E1E;font-size:12.5px;line-height:1.75}
.rp-measure{width:634px}
.rp-page{width:794px;height:1123px;background:#fff;position:relative;overflow:hidden;margin-bottom:20px}
.rp-stripe{position:absolute;left:0;right:0;bottom:0;height:8px;background:#F79C6D}
.rp-num{position:absolute;left:80px;bottom:34px;font-size:10px;color:#8A8A8A}
.rp-body{position:absolute;top:80px;left:80px;right:80px}
.rp-block{padding-bottom:16px}
.rp-h2{font-size:27px;font-weight:700;line-height:1.35;color:#1E1E1E;padding-top:6px}
.rp-bar{color:#fff;font-weight:600;font-size:14px;text-align:center;padding:10px 16px}
.rp-bar.or{background:#F79C6D}.rp-bar.te{background:#33957F}.rp-bar.ye{background:#F8B941}.rp-bar.sa{background:#FF8A75}
.rp-bar.gr{background:linear-gradient(90deg,#FCE6DA,#F79C6D)}
.rp-cream{background:#FDF5EF;padding:26px 34px;font-size:13px;line-height:2.15;color:#2A2A2A}
.rp-cream p{margin:0 0 10px}.rp-cream p:last-child{margin:0}
.rp-tiles{display:flex}
.rp-tiles > div{flex:1;text-align:center}
.rp-tiles .tl{height:78px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff}
.rp-tiles .lb{font-size:12.5px;padding:10px 6px 0;line-height:1.6}
.rp-big{display:flex}
.rp-big > div{flex:1;padding:26px 30px 24px;color:#fff;text-align:right}
.rp-big b{display:block;font-size:44px;line-height:1.15;font-weight:700}
.rp-big span{font-size:12.5px;line-height:1.7;display:block;margin-top:6px}
.rp-ol{list-style:none;margin:0;padding:0}
.rp-ol li{display:flex;gap:12px;padding:5px 0;font-size:12.5px;line-height:2}
.rp-ol li > i{flex:none;font-style:normal;font-weight:700;width:20px;text-align:left}
.rp-ol li > div{flex:1}
.rp-imp{font-weight:700}
.rp-sub{color:#6B6B6B;font-size:11.5px}
.rp-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.rp-tags span{background:#F2F2F2;border-radius:3px;padding:0 10px;font-size:11px;line-height:2}
table.rp-t{width:100%;border-collapse:collapse;font-size:12.5px}
.rp-t th{color:#fff;font-weight:600;text-align:right;padding:10px 14px}
.rp-t th.p{background:#FBE1D6;color:#F07E66}
.rp-t td{padding:10px 14px;border-bottom:1px solid #fff}
.rp-t tr:nth-child(even) td{background:#F6F6F6}
.rp-t tr.tot td{background:#FCEDE6;font-weight:700}
.rp-kv{width:100%;border-collapse:collapse;font-size:12.5px}
.rp-kv td{padding:11px 14px;border-bottom:1px solid #ECECEC;vertical-align:top}
.rp-kv td.k{background:#FCEDE6;color:#F07E66;width:150px}
.rp-ph{display:flex;gap:20px}
.rp-ph > div{flex:1;min-width:0}
.rp-ph .im{height:250px;background-size:cover;background-position:center;background-color:#F2F2F2}
.rp-ph .cap{background:#FDF0EA;padding:9px 14px;font-size:11.5px;line-height:1.85;min-height:58px}
.rp-ph .cap b{color:#F07E66;font-weight:700;margin-left:6px}
.rp-row{display:flex;flex-wrap:wrap;gap:3px 10px;padding:7px 0;border-bottom:1px solid #EFEFEF;align-items:flex-start}
.rp-row .no{flex:none;width:24px;font-weight:700;font-size:11px;color:#F07E66;padding-top:1px}
.rp-row .nm{flex:none;width:165px;font-weight:600;font-size:11.5px;line-height:1.5}
.rp-row .nm small{display:block;font-weight:400;color:#8A8A8A;font-size:9.5px}

}

/* الصور تُحفظ في IndexedDB (سعة كبيرة)، والبيانات النصية في localStorage أيضًا كنسخة ثانية */
const IDB_NAME="mosque-readiness-db", IDB_STORE="kv";
let idbP=null;
function idb(){
  if(idbP) return idbP;
  idbP = new Promise((res,rej)=>{ try{ const r=indexedDB.open(IDB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } });
  return idbP;
}
async function idbPut(k,v){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction(IDB_STORE,"readwrite"); t.objectStore(IDB_STORE).put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
async function idbGet(k){ const db=await idb(); return new Promise((res,rej)=>{ const r=db.transaction(IDB_STORE,"readonly").objectStore(IDB_STORE).get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbDel(k){ const db=await idb(); return new Promise(res=>{ const t=db.transaction(IDB_STORE,"readwrite"); t.objectStore(IDB_STORE).delete(k); t.oncomplete=()=>res(); t.onerror=()=>res(); }); }
function photoCount(st){ let n=0; Object.values((st&&st.items)||{}).forEach(i=>n+=(i.ph||[]).length); return n; }
let storeReady=false;
async function saveNow(){
  if(!storeReady) return;
  state.updated = new Date().toISOString();
  const snap = JSON.parse(JSON.stringify(state));
  let lsOk=false, idbOk=false;
  try{ const lite=JSON.parse(JSON.stringify(snap)); Object.values(lite.items).forEach(i=>i.ph=[]); localStorage.setItem(STORE_KEY, JSON.stringify(lite)); lsOk=true; }catch(e){}
  try{ await idbPut("state", snap); idbOk=true; }catch(e){}
  if(idbOk) savedBadge("محفوظ تلقائيًا ✓");
  else if(lsOk) savedBadge(photoCount(snap)?"حُفظت البيانات، وتعذّر حفظ الصور — نزّلها الآن من «تنزيل جميع الصور»":"محفوظ تلقائيًا ✓", photoCount(snap)?"warn":"");
  else savedBadge("تعذّر الحفظ التلقائي — احفظ نسخة احتياطية الآن", "err");
}
function adopt(d){
  const base = freshState();
  state = Object.assign(base, d, { meta:Object.assign(base.meta,d.meta||{}), decision:Object.assign(base.decision,d.decision||{}), exp:Object.assign(base.exp,d.exp||{}) });
  if(!state.meta.evaluator) state.meta.evaluator = base.meta.evaluator;
  if(!state.meta.evaluatorOrg) state.meta.evaluatorOrg = base.meta.evaluatorOrg;
  restored = true;
}
async function loadSaved(){
  let ls=null, db=null;
  try{ const raw=localStorage.getItem(STORE_KEY); if(raw){ const d=JSON.parse(raw); if(d&&d.v===1) ls=d; } }catch(e){}
  try{ const d=await idbGet("state"); if(d&&d.v===1) db=d; }catch(e){}
  let pick = db && (!ls || (db.updated||"")>=(ls.updated||"")) ? db : ls;
  if(pick && db && pick===ls && db.id===ls.id){
    Object.entries(db.items||{}).forEach(([k,it])=>{ if(it.ph&&it.ph.length){ const t=pick.items[k]||(pick.items[k]={a:false,c:{},note:"",ph:[]}); if(!t.ph||!t.ph.length) t.ph=it.ph; } });
  }
  if(pick) adopt(pick);
  storeReady=true;
  if(ls && photoCount(ls)) saveNow();   /* ترحيل الصور القديمة من localStorage إلى IndexedDB */
}

/* ---------------- المسجد والرمز ---------------- */
function mosqueInfo(){
  const m = state.meta;
  if(m.mosque==="new") return { name:m.name||"مسجد جديد", city:m.city, region:m.region, no:null };
  const x = MOSQUES.find(q=>q.no===m.mosque);
  return x ? { name:x.name, city:x.city, region:x.region, no:x.no } : { name:"", city:"", region:"", no:null };
}
function mosqueCode(){
  const i = mosqueInfo();
  if(!i.region) return "";
  return "MJ"+i.region+"-"+(i.no ? String(i.no).padStart(3,"0") : "NEW");
}

/* ---------------- الإحصاءات ---------------- */
function elStats(el){
  const it = peek(el.k);
  const s = { absent:false, total:el.crit.length, done:0, r:0, n:0, x:0, imp:{b:0,u:0,l:0,none:0}, sev:null };
  if(it && it.a){ s.absent=true; s.total=0; return s; }
  el.crit.forEach((_,i)=>{
    const c = it && it.c[i]; if(!c || !c.s) return;
    s.done++;
    if(c.s==="r") s.r++; else if(c.s==="x") s.x++;
    else { s.n++; const im = IMPACT[c.i] ? c.i : "none"; s.imp[im]++; if(!s.sev || IMPACT[im].rank>IMPACT[s.sev].rank) s.sev=im; }
  });
  return s;
}
function agg(els){
  const a = { els:0, absent:0, total:0, done:0, r:0, n:0, x:0, b:0, u:0, l:0, none:0 };
  els.forEach(el=>{ const s=elStats(el); a.els++; if(s.absent){a.absent++;return;}
    a.total+=s.total; a.done+=s.done; a.r+=s.r; a.n+=s.n; a.x+=s.x; a.b+=s.imp.b; a.u+=s.imp.u; a.l+=s.imp.l; a.none+=s.imp.none; });
  a.readiness = pct(a.r, a.r+a.n);
  a.completion = a.total ? pct(a.done, a.total) : (a.els? 100 : 0);
  return a;
}
function computeAll(){
  const per = MAINS.map(m=>Object.assign({ main:m }, agg(ELS.filter(e=>e.main===m))));
  const tot = agg(ELS);
  const findings = [];
  ELS.forEach(el=>{ const s=elStats(el); if(s.n>0) findings.push({ el, s }); });
  findings.sort((a,b)=>IMPACT[b.s.sev].rank-IMPACT[a.s.sev].rank);
  return { per, tot, findings };
}
function elStatus(el){
  const s = elStats(el);
  if(s.absent) return { cls:"absent", pill:"غير موجود" };
  if(s.done===0) return { cls:"none", pill:"لم يُقيَّم" };
  if(s.n>0){ const c = s.sev==="b"?"bad":s.sev==="u"?"badu":s.sev==="l"?"badl":"bad"; return { cls:c, pill:"غير جاهز · "+IMPACT[s.sev].short }; }
  if(s.done<s.total) return { cls:"partial", pill:s.done+" / "+s.total };
  return { cls:"ok", pill:"جاهز ✓" };
}
function barColor(p){ return p==null ? "#E3CFC3" : p>=90 ? "#33957F" : p>=70 ? "#E9853F" : "#E5533D"; }

/* ---------------- التنقل ---------------- */
function navHTML(){

    opts += `<option value="${i}" ${i===state.step?"selected":""}>${esc(s.type==="page" && s.main!==s.title ? s.main+" · "+s.title : s.title)}${mark}</option>`;
  });

function go(i, focusK){

document.addEventListener("click", async e=>{
  const t = e.target.closest("[data-act]"); if(!t) return;
  const act=t.dataset.act, k=t.dataset.k;
  switch(act){
    case "prev": go(state.step-1); break;
    case "next":
      if(state.step===0){
        const m=state.meta;
        if(!m.mosque){ toast("اختر المسجد أولًا", true); return; }
        if(m.mosque==="new" && (!m.name || !m.region)){ toast("أدخل اسم المسجد ومنطقته", true); return; }
        if(!m.evaluator){ toast("أدخل اسم المقيّم", true); return; }
      }
      go(state.step+1); break;
    case "goto": go(+t.dataset.i, k); break;
    case "toggle": { const el=ELMAP[k]; openState[k]=!isOpen(el); rerenderCard(k); break; }
    case "st": {
      const it=item(k), c=+t.dataset.c, v=t.dataset.v; const cur=it.c[c]||{};
      it.c[c] = cur.s===v ? {} : { s:v, i: v==="n" ? cur.i : undefined };
      openState[k]=true; save(); rerenderCard(k); break; }
    case "imp": { const it=item(k), c=+t.dataset.c; it.c[c].i = it.c[c].i===t.dataset.v ? undefined : t.dataset.v; save(); rerenderCard(k); break; }
    case "allok": { const it=item(k); ELMAP[k].crit.forEach((_,i)=>{ if(!it.c[i]||!it.c[i].s) it.c[i]={s:"r"}; }); openState[k]=false; save(); rerenderCard(k); break; }
    case "pageok": {
      const st=STEPS[state.step];
      openSheet(`<h3>تعيين البنود غير المُقيَّمة: جاهز؟</h3><p>سيُعيَّن كل بند لم يُقيَّم في صفحة «${esc(st.title)}» كـ «جاهز». البنود التي قيّمتها لن تتغير.</p>
        <div class="mbtns"><button class="mbtn primary" data-act="pageok-yes">نعم، عيّنها جاهز</button><button class="mbtn" data-act="close">إلغاء</button></div>`); break; }
    case "pageok-yes": {
      STEPS[state.step].els.forEach(el=>{ const it=item(el.k); if(it.a) return; el.crit.forEach((_,i)=>{ if(!it.c[i]||!it.c[i].s) it.c[i]={s:"r"}; }); delete openState[el.k]; });
      closeSheet(); save(); render(); break; }
    case "close": closeSheet(); break;
    case "delph": { const it=item(k); it.ph.splice(+t.dataset.i,1); save(); rerenderCard(k); break; }
    case "dec": state.decision.value = state.decision.value===t.dataset.v ? "" : t.dataset.v; save(); render(); break;
    case "geo":
      if(!navigator.geolocation){ toast("الجهاز لا يدعم تحديد الموقع", true); return; }
      t.textContent="…";
      navigator.geolocation.getCurrentPosition(p=>{ state.meta.lat=p.coords.latitude.toFixed(6); state.meta.lng=p.coords.longitude.toFixed(6); save(); render(); toast("تم تحديد الموقع ✓"); },
        ()=>{ t.textContent="📍 موقعي"; toast("تعذّر تحديد الموقع — تأكد من السماح بالوصول", true); }, { enableHighAccuracy:true, timeout:15000 });
      break;
    case "pdf": exportPDF(); break;
    case "xlsx": exportXLSX(); break;
    case "sheets": sendSheets(); break;
    case "backup": exportBackup(); break;
    case "photos": downloadAllPhotos(); break;
    case "ios-save": iosSave(); break;
    case "ios-skip": pendingSaves=[]; closeSheet(); break;
    case "new": confirmNew(); break;
    case "new-backup": exportBackup(); break;
    case "new-yes": try{ localStorage.removeItem(STORE_KEY); }catch(_){} idbDel("state").catch(()=>{}); state=freshState(); restored=false; for(const x in openState) delete openState[x]; closeSheet(); render(); window.scrollTo(0,0); toast("بدأ تقييم جديد"); break;
    case "share": shareCurrent(); break;
  }
});
document.addEventListener("change", async e=>{
  const t=e.target;
  if(t.matches("[data-nav]")) go(+t.value);
  else if(t.dataset.absent){ const k=t.dataset.absent; item(k).a=t.checked; openState[k]=!t.checked; save(); rerenderCard(k); }
  else if(t.dataset.m==="mosque" || t.dataset.m==="region"){
    state.meta[t.dataset.m]=t.value;
    if(t.dataset.m==="mosque"){ const x=MOSQUES.find(q=>q.no===t.value); state.meta.district = x ? x.district : ""; }
    save(); render(); }
  else if(t.dataset.pick){ const k=t.dataset.pick;
    if(t.value==="__new"){ state.meta[k+"New"]=true; state.meta[k]=""; } else { state.meta[k+"New"]=false; state.meta[k]=t.value; }
    save(); render(); if(t.value==="__new"){ const i=document.querySelector(`[data-addlist="${k}"]`); if(i) i.focus(); } }
  else if(t.dataset.qty){ item(t.dataset.qty).q = t.value; save(); }
  else if(t.dataset.addlist){ addToList(t.dataset.addlist, t.value); }
  else if(t.dataset.photo){
    const k=t.dataset.photo, it=item(k), files=[...t.files].slice(0, 4-it.ph.length), fresh=[];
    for(const f of files){ try{ it.ph.push(await compressImage(f)); if(Date.now()-(f.lastModified||0) < 3*60*1000) fresh.push(new File([f], photoName(ELMAP[k], it.ph.length, f), { type:f.type||"image/jpeg" })); }catch(err){ toast("تعذّرت قراءة الصورة", true); } }
    openState[k]=true; save(); rerenderCard(k);
    if(fresh.length && autoSaveOn()) saveToDevice(fresh);
  }
  else if(t.matches("[data-import]")) importBackup(t.files[0]);
  else if(t.matches("[data-autosave]")){ try{ localStorage.setItem(AUTOSAVE_KEY, t.checked?"1":"0"); }catch(_){} toast(t.checked?"حفظ الصور في الجوال: مفعّل":"حفظ الصور في الجوال: متوقف"); }
});
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.dataset.note){ item(t.dataset.note).note=t.value; save(); }
  else if(t.dataset.ty){ item(t.dataset.ty).ty=t.value; save(); }
  else if(t.dataset.br){ item(t.dataset.br).br=t.value; save(); }
  else if(t.dataset.m && t.dataset.m!=="mosque" && t.dataset.m!=="region"){
    if(t.dataset.m==="latlng"){ const [a,b]=t.value.split(/[,،\s]+/).filter(Boolean); state.meta.lat=a||""; state.meta.lng=b||""; }
    else state.meta[t.dataset.m]=t.value;
    if(t.dataset.m==="date"){ const h=$("#hijriOut"); if(h) h.textContent = hijri(t.value); }
    save();
  }
  else if(t.dataset.d){ state.decision[t.dataset.d]=t.value; save(); }
});

/* ---------------- الصور ---------------- */
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const AUTOSAVE_KEY = "mosque-readiness-autosave";
function autoSaveOn(){ try{ return localStorage.getItem(AUTOSAVE_KEY)!=="0"; }catch(_){ return true; } }
const safeName = s => String(s||"").replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g," ").trim();
function photoName(el, n, f){
  const ext = ((f&&f.name||"").match(/\.(jpe?g|png|heic|heif|webp)$/i)||[".jpg"])[0].toLowerCase();
  return safeName(`${mosqueCode()||"مسجد"}_${el.main}_${el.no}-${el.name}_${n}`)+ext;
}
let pendingSaves=[];
function saveToDevice(files){
  if(IS_IOS){
    pendingSaves = pendingSaves.concat(files);
    let can=false; try{ can = !!(navigator.canShare && navigator.canShare({ files:pendingSaves })); }catch(_){}
    openSheet(`<h3>حفظ ${pendingSaves.length===1?"الصورة":"الصور ("+pendingSaves.length+")"} في الجوال</h3>
      <p>${can?"اضغط الزر ثم اختر «حفظ الصورة» / Save Image.":"اضغط مطولًا على الرابط ثم اختر الحفظ."}</p>
      <div class="mbtns">${can?`<button class="mbtn primary" data-act="ios-save">📥 حفظ في الصور</button>`:pendingSaves.map(f=>`<a class="mbtn" href="${URL.createObjectURL(f)}" download="${esc(f.name)}">${esc(f.name)}</a>`).join("")}
      <button class="mbtn" data-act="ios-skip">لاحقًا</button></div>`);
    return;
  }
  files.forEach((f,i)=>setTimeout(()=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000); }, i*400));
  toast(files.length===1?"حُفظت الصورة في الجوال (التنزيلات) ✓":`حُفظت ${files.length} صور في الجوال (التنزيلات) ✓`);
}
async function iosSave(){
  const files=pendingSaves; pendingSaves=[];
  try{ await navigator.share({ files }); closeSheet(); toast("تم ✓"); }catch(e){ if(e && e.name==="AbortError"){ pendingSaves=files; } else { closeSheet(); toast("تعذّر الحفظ", true); } }
}
async function downloadAllPhotos(){
  const list=[]; ELS.forEach(el=>{ const it=peek(el.k); if(it&&it.ph) it.ph.forEach((p,i)=>list.push({ el, p, n:i+1 })); });
  if(!list.length){ toast("لا توجد صور في هذا التقييم", true); return; }
  if(!window.JSZip){ toast("تعذّر تحميل مكتبة الضغط — تحقق من الاتصال", true); return; }
  busy(true,"جاري تجهيز الصور…");
  try{
    const zip=new JSZip(), root=safeName(`صور_${mosqueCode()||"مسجد"}_${state.meta.date||""}`);
    list.forEach(({el,p,n})=>zip.folder(root).folder(safeName(el.main)).file(safeName(`${el.no}-${el.name}_${n}`)+".jpg", p.split(",")[1], { base64:true }));
    const blob=await zip.generateAsync({ type:"blob" }); busy(false);
    deliver(blob, root+".zip", `ملف الصور (${list.length} صورة)`);
  }catch(e){ busy(false); toast("تعذّر تجهيز الصور", true); }
}
function compressImage(file, max=900, q=0.6){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ let w=img.naturalWidth,h=img.naturalHeight; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h); URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg",q)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(); }; img.src=url;
  });
}

let currentFile=null;
function baseName(){ return "تقييم-جاهزية_"+(mosqueCode()||"مسجد")+"_"+(state.meta.date||""); }
function deliver(blob, name, label){
  const url = URL.createObjectURL(blob);
  currentFile = new File([blob], name, { type:blob.type });
  let canShare=false; try{ canShare = !!(navigator.canShare && navigator.canShare({ files:[currentFile] })); }catch(e){}
  openSheet(`<h3>${label} جاهز ✓</h3><p>${esc(name)}</p><div class="mbtns">
    <a class="mbtn primary" href="${url}" download="${esc(name)}">⬇ تنزيل الملف</a>
    ${canShare?`<button class="mbtn" data-act="share">↗ مشاركة / حفظ في الملفات</button>`:""}
    <a class="mbtn" href="${url}" target="_blank" rel="noopener">فتح في نافذة جديدة</a>
    <button class="mbtn" data-act="close">إغلاق</button></div>`);
}
function shareCurrent(){ if(currentFile) navigator.share({ files:[currentFile], title:currentFile.name }).catch(()=>{}); }
function exportBackup(){
  const blob = new Blob([JSON.stringify(state)], { type:"application/json" });
  deliver(blob, baseName()+".json", "النسخة الاحتياطية");
}
function importBackup(file){
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||d.v!==1||!d.items) throw 0;
      const base=freshState(); state=Object.assign(base,d,{meta:Object.assign(base.meta,d.meta||{}),decision:Object.assign(base.decision,d.decision||{}),exp:Object.assign(base.exp,d.exp||{})});
      saveNow(); render(); toast("تم استيراد التقييم ✓"); }catch(e){ toast("الملف غير صالح", true); } };
  r.readAsText(file);
}

/* ---------------- Excel ---------------- */
function statusLabel(c){ return !c||!c.s ? "لم يُقيَّم" : c.s==="r" ? "جاهز" : c.s==="x" ? "لا ينطبق" : "غير جاهز"; }
function detailRows(){
  const rows=[];
  ELS.forEach(el=>{ const it=peek(el.k)||{a:false,c:{},note:""};
    const phc = (it.ph||[]).length || "", qty = it.q ? +it.q : "", ty = it.ty||"", br = it.br||"";
    if(it.a){ rows.push({ el, crit:"—", status:"غير موجود", impact:"", note:it.note||"", phc, qty:"", ty:"", br:"" }); return; }
    el.crit.forEach((c,i)=>{ const v=it.c[i]; rows.push({ el, crit:c, status:statusLabel(v), impact: v&&v.s==="n" ? IMPACT[v.i||"none"].label : "", note: i===0 ? (it.note||"") : "", phc: i===0 ? phc : "", qty: i===0 ? qty : "", ty: i===0 ? ty : "", br: i===0 ? br : "" }); });
  });
  return rows;
}

/* ---------------- Google Sheets ---------------- */
async function sendSheets(){
  if(!SHEETS_URL){ openSheet(`<h3>رابط Google Sheets غير مضبوط</h3><p>انشر سكربت Apps Script المرفق كـ Web App، ثم ضع رابطه في أول سطر بالإعدادات داخل ملف الصفحة:</p><pre class="code">const SHEETS_URL = "https://script.google.com/macros/s/…/exec";</pre><div class="mbtns"><button class="mbtn" data-act="close">حسنًا</button></div>`); return; }
  const { per, tot } = computeAll(), info=mosqueInfo(), d=state.decision;
  const payload = { id:state.id, sentAt:new Date().toISOString(), mosque:info.name, code:mosqueCode(), city:info.city||"", region:REGION_NAMES[info.region]||"",
    meta:state.meta, kpis:{ readiness:tot.readiness, completion:tot.completion, total:tot.total, done:tot.done, ready:tot.r, notReady:tot.n, na:tot.x, blocking:tot.b, urgent:tot.u, later:tot.l, unspecified:tot.none, absent:tot.absent },
    decision:{ value:d.value?DECISIONS[d.value].label:"", reason:d.reason, signer:d.signer||state.meta.evaluator, signerTitle:d.signerTitle },
    sections: per.map(p=>({ main:p.main, total:p.total, done:p.done, ready:p.r, notReady:p.n, blocking:p.b, readiness:p.readiness })),
    rows: detailRows().map(r=>({ main:r.el.main, page:r.el.title, no:r.el.no, element:r.el.name, qty:r.qty, type:r.ty, brand:r.br, criterion:r.crit, status:r.status, impact:r.impact, note:r.note })) };
  busy(true,"جاري الإرسال…");
  try{
    await fetch(SHEETS_URL, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify(payload) });
    state.exp.sheets=true; save(); busy(false); render(); toast("أُرسل التقييم إلى Google Sheets ✓");
  }catch(e){ busy(false); toast("تعذّر الإرسال — تحقق من الاتصال وأعد المحاولة", true); }
}

async function rasterIcons(){
  if(ICON_PNG.pin) return;

}

function rpChips(el){
  const it=peek(el.k)||{a:false,c:{}};
  if(it.a) return `<span class="ck x">غير موجود في المسجد</span>`;
  return el.crit.map((c,i)=>{ const v=it.c[i]||{};
    if(v.s==="r") return `<span class="ck r">✓ ${esc(c)}</span>`;
    if(v.s==="x") return `<span class="ck x">— ${esc(c)}</span>`;
    if(v.s==="n") return `<span class="ck n">✗ ${esc(c)} · ${IMPACT[v.i||"none"].short}</span>`;
    return `<span class="ck">○ ${esc(c)}</span>`; }).join("");
}
function dividerBg(){

  g.fillStyle="#FBE9E1"; g.fillRect(432,190,788,1020);

}

  add(`<table class="rp-t"><tr><th style="background:${RP.or}">القسم</th><th class="p">المُقيَّم</th><th class="p">غير جاهز</th><th class="p">يمنع الافتتاح</th><th style="background:${RP.ye}">نسبة الجاهزية</th></tr>
    ${per.map(p=>`<tr><td>${esc(p.main)}</td><td>${p.done} / ${p.total}</td><td>${p.n}</td><td style="${p.b?"color:#E5533D;font-weight:700":""}">${p.b}</td><td style="font-weight:700">${p.readiness==null?"—":p.readiness+"%"}</td></tr>`).join("")}
    <tr class="tot"><td>الإجمالي</td><td>${tot.done} / ${tot.total}</td><td>${tot.n}</td><td>${tot.b}</td><td>${tot.readiness==null?"—":tot.readiness+"%"}</td></tr></table>`);
  const blockers=[]; findings.forEach(({el})=>{ const it=peek(el.k); el.crit.forEach((c,i)=>{ const v=it.c[i]; if(v&&v.s==="n"&&v.i==="b") blockers.push([el,c,it]); }); });
  if(blockers.length){
    add(`<div class="rp-h2" style="font-size:24px">البنود التي تمنع الافتتاح</div>`, true);
    add(`<table class="rp-t"><tr><th style="background:${RP.or}">العنصر</th><th class="p">القسم</th><th style="background:${RP.ye}">البند غير الجاهز</th></tr>
      ${blockers.map(([el,c,it])=>`<tr><td>${esc(el.name)}</td><td>${esc(el.main)}</td><td>${esc(c)}${it.note?`<div class="rp-sub">${esc(it.note)}</div>`:""}</td></tr>`).join("")}
      <tr class="tot"><td>الإجمالي</td><td colspan="2">${blockers.length} ${blockers.length===1?"بند":"بنود"} يجب معالجتها قبل الافتتاح</td></tr></table>`);
  }
  /* findings by section */
  const B=[]; const addA=add; const add2=(html,keep)=>B.push({html,keep:!!keep});
  { const add=add2;
  add(`<div class="rp-h2">الملاحظات والبنود غير الجاهزة</div>`, true);
  const secs = MAINS.map(mn=>({ mn, list:findings.filter(f=>f.el.main===mn).sort((a,b)=>IMPACT[b.s.sev].rank-IMPACT[a.s.sev].rank) })).filter(x=>x.list.length);
  if(!secs.length) add(`<div class="rp-cream">لم تُرصد بنود غير جاهزة في هذا التقييم.</div>`);
  secs.forEach(({mn,list},si)=>{
    add(`<div class="rp-bar ${BARS[si%4]}">${ORD[si]||""}: ${esc(mn)}</div>`, true);
    list.forEach(({el},ii)=>{ const it=peek(el.k);
      const bad=el.crit.map((c,i)=>{ const v=it.c[i]; return v&&v.s==="n" ? `${esc(c)} <span class="rp-imp" style="color:${IMPC[v.i||"none"]}">(${IMPACT[v.i||"none"].label})</span>` : ""; }).filter(Boolean).join("، ");
      add(`<ol class="rp-ol"><li><i>${ii+1}.</i><div><b>${esc(el.name)}</b> <span class="rp-sub">— ${esc(el.title)}</span>: ${bad}.${it.note?` ${esc(it.note)}`:""}${specs(it)?`<div class="rp-tags"><span>${specs(it).split(" · ").join("</span><span>")}</span></div>`:""}</div></li></ol>`);
    });
  });
  /* photos */
  const phs=[]; STEPS.forEach(st=>{ if(st.type!=="page") return; st.els.forEach(el=>{ const it=peek(el.k); if(it&&it.ph&&it.ph.length&&!it.a) it.ph.forEach(p=>phs.push({p,el,it})); }); });
  if(phs.length){
    add(`<div class="rp-bar gr">الشواهد المصوّرة</div>`, true);
    for(let i=0;i<phs.length;i+=2){
      add(`<div class="rp-ph">${phs.slice(i,i+2).map((x,j)=>`<div><div class="im" style="background-image:url('${x.p}')"></div><div class="cap"><b>صورة (${i+j+1})</b>${esc(x.el.name)} — ${esc(x.el.main)}${x.it.note?`، ${esc(x.it.note)}`:""}</div></div>`).join("")}${phs.length-i===1?"<div></div>":""}</div>`);
    }
  }
  /* decision */
  const dc = d.value==="ready"?RP.te : d.value==="cond"?RP.or : d.value==="not"?RP.sa : "#9A9A9A";
  add(`<div class="rp-h2">قرار الجاهزية والاعتماد</div>`, true);
  add(`<div class="rp-dec" style="background:${dc}"><span>قرار الجاهزية</span><b>${esc(decTxt)}</b></div>`, true);
  if(d.reason) add(`<div class="rp-cream"><b>المبررات والاشتراطات:</b> ${esc(d.reason)}</div>`);
  add(`<table class="rp-kv"><tr><td class="k">المعتمد</td><td>${esc(d.signer||m.evaluator)}</td></tr><tr><td class="k">الصفة</td><td>${esc(d.signerTitle)}</td></tr>
    <tr><td class="k">التاريخ</td><td>${esc(hij(m.date))} — ${esc(greg(m.date))}</td></tr><tr><td class="k">التوقيع</td><td style="height:64px"></td></tr></table>`);
  }
  /* appendix */
  const X=[]; const addX=(html,keep)=>X.push({html,keep:!!keep});
  addX(`<div style="display:flex;gap:6px;flex-wrap:wrap"><span class="ck r">✓ جاهز</span><span class="ck n">✗ غير جاهز · الأثر</span><span class="ck x">— لا ينطبق</span><span class="ck">○ لم يُقيَّم</span></div>`);
  let mi=-1, lastMain=null;
  STEPS.forEach(st=>{ if(st.type!=="page") return;
    if(st.main!==lastMain){ mi++; lastMain=st.main; }
    addX(`<div class="rp-bar ${BARS[mi%4]}">${esc(st.main)}${st.main!==st.title?" · "+esc(st.title):""}</div>`, true);
    st.els.forEach(el=>{ const it=peek(el.k);
      addX(`<div class="rp-row"><div class="no">${esc(el.no)}</div><div class="nm">${esc(el.name)}${el.sub&&el.sub!==el.name?`<small>${esc(el.sub)}</small>`:""}${it&&!it.a&&(it.q||it.ty||it.br)?`<small style="color:${RP.sal};font-weight:600">${specs(it)}</small>`:""}</div><div class="cr">${rpChips(el)}</div>${it&&it.note?`<div class="rn">ملاحظة: ${esc(it.note)}</div>`:""}</div>`); });
  });
  return { cover, infoPage, A, B, X, allPh };
}
function paginate(host, blocks, avail){
  host.innerHTML = `<div class="rp-measure">${blocks.map(b=>`<div class="rp-block">${b.html}</div>`).join("")}</div>`;
  const hs=[...host.firstChild.children].map(n=>n.getBoundingClientRect().height);
  const pages=[]; let cur=[], h=0;
  blocks.forEach((b,i)=>{
    if(h+hs[i] > avail && cur.length){
      let carry=[]; while(cur.length && blocks[cur[cur.length-1]].keep) carry.unshift(cur.pop());
      if(!cur.length){ cur=carry; carry=[]; }
      pages.push(cur); cur=carry; h=carry.reduce((s,j)=>s+hs[j],0);
    }
    cur.push(i); h+=hs[i];
  });
  if(cur.length) pages.push(cur);
  return pages.map(pg=>pg.map(i=>blocks[i].html));
}
async function exportPDF(){
  if(!window.html2canvas || !window.jspdf){ toast("تعذّر تحميل مكتبات التقرير — تحقق من الاتصال", true); return; }
  busy(true, "جاري إعداد التقرير…");
  const host=$("#pdfHost");
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    window.scrollTo(0,0);
    await rasterIcons();
    const P=reportParts(), AVAIL=1123-80-96;
    const flow=paginate(host, P.A, AVAIL), flow2=paginate(host, P.B, AVAIL), appx=paginate(host, P.X, AVAIL);
    const divider=(bg,lt,title,photo)=>`<div class="rp-page"><div class="dv2" style="background:${bg};--dvc:${bg}"></div><div class="dv2-r"></div><div class="dv2-t">${title}</div>${photo?`<div class="dv2-ph" style="--dvc:${bg};background-image:url('${photo}')"></div>`:""}</div>`;
    const flowPage=pg=>`<div class="rp-page"><div class="rp-body">${pg.map(b=>`<div class="rp-block">${b}</div>`).join("")}</div><div class="rp-stripe"></div>${num()}</div>`;
    const html=[]; const num=()=>`<div class="rp-num">${html.length+1}</div>`;
    html.push(P.cover);
    html.push(P.infoPage.replace("__NUM__", num()));
    flow.forEach(pg=>html.push(flowPage(pg)));
    html.push(divider("#F8B941","","الملاحظات<br>والشواهد المصوّرة", P.allPh[3]||P.allPh[0]));
    flow2.forEach(pg=>html.push(flowPage(pg)));
    html.push(divider("#33957F","","ملحق<br>التقييم التفصيلي", P.allPh[4]||P.allPh[1]));
    appx.forEach(pg=>html.push(flowPage(pg)));
    html.push(`<div class="rp-page bk"><img src="${LOGO_WH}"></div>`);
    host.innerHTML = html.join("");
    const pageEls=[...host.querySelectorAll(".rp-page")];
    const { jsPDF } = window.jspdf; const pdf=new jsPDF({ orientation:"p", unit:"mm", format:"a4", compress:true });
    for(let i=0;i<pageEls.length;i++){
      busy(true, `جاري إنشاء الصفحة ${i+1} من ${pageEls.length}…`);
      await new Promise(r=>setTimeout(r,20));
      const cv=await html2canvas(pageEls[i], { scale:2, useCORS:true, backgroundColor:"#ffffff", logging:false, scrollX:0, scrollY:0, windowWidth:900 });
      if(i) pdf.addPage();
      pdf.addImage(cv.toDataURL("image/jpeg",0.9), "JPEG", 0, 0, 210, 297, undefined, "FAST");
    }
    const blob=pdf.output("blob");
    host.innerHTML=""; busy(false);
    state.exp.pdf=true; save();
    if(STEPS[state.step].type==="summary") render();
    deliver(blob, baseName()+".pdf", "تقرير PDF");
  }catch(err){ console.error(err); host.innerHTML=""; busy(false); toast("حدث خطأ أثناء إنشاء التقرير", true); }
}
