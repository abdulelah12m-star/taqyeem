<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>تقييم جاهزية المساجد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E1E1E; --navy:#33957F; --navy-2:#1E1E1E; --brown:#F07E66; --gold:#F79C6D;
  --gold-soft:#FBE6DB; --sand:#FDF6F1; --card:#FFFFFF; --line:#F1E2D9; --muted:#6B6B6B;
  --ok:#33957F; --ok-soft:#E3F1EC; --bad:#E5533D; --bad-soft:#FFE6E0;
  --warn:#E9853F; --warn-soft:#FDEBD9; --na:#8A8F91; --na-soft:#EEF0F0;
  --yellow:#F8B941; --salmon:#FF8A75;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--sand);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.pattern{height:6px;background:var(--gold)}
header.top{background:linear-gradient(90deg,#FAD0BA 0%,#F7A67D 40%,#F79C6D 70%);color:#fff;padding:20px 16px 22px;position:relative;overflow:hidden}
.top-inner{max-width:760px;margin:0 auto;position:relative;z-index:1;display:flex;align-items:center;gap:14px}
.top-inner img{height:46px;flex:none}
.top-inner h1{margin:0;font-size:1.22rem;font-weight:700;line-height:1.35}
.top-inner p{margin:2px 0 0;color:#fff;opacity:.92;font-size:.82rem}

/* sticky step bar */
.stepbar{position:sticky;top:0;z-index:30;background:var(--sand);border-bottom:1px solid var(--line);box-shadow:0 6px 12px -10px rgba(33,29,26,.35)}
.stepbar-inner{max-width:760px;margin:0 auto;padding:10px 14px 9px}
.step-row{display:flex;gap:8px;align-items:center}
.step-select{flex:1;min-width:0;padding:10px 10px;border:1.5px solid var(--navy);border-radius:11px;background:#fff;font-weight:600;font-size:.88rem}
.step-count{flex:none;font-size:.75rem;font-weight:700;color:var(--brown);background:var(--gold-soft);padding:6px 10px;border-radius:20px}
.prog{height:6px;background:#F6E7DE;border-radius:6px;overflow:hidden;margin-top:9px}
.prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--brown));border-radius:6px;transition:width .25s}
.prog-legend{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:3px}

main{max-width:760px;margin:0 auto;padding:16px 14px 120px}

.page-head{margin:4px 0 14px}
.eyebrow{font-size:.75rem;font-weight:700;color:var(--brown);letter-spacing:0}
.page-head h2{margin:2px 0 6px;font-size:1.3rem;font-weight:700;color:var(--navy-2)}
.page-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.mini{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:20px}
.mini.b{background:var(--bad-soft);color:var(--bad)}
.mini.u{background:var(--warn-soft);color:var(--warn)}
.linkbtn{background:none;border:none;color:var(--brown);font-weight:700;font-size:.8rem;text-decoration:underline;padding:4px 0}
.hint{background:var(--gold-soft);border:1px solid #F9CDB6;color:#8A3F2C;border-radius:12px;padding:10px 13px;font-size:.82rem;margin-bottom:14px}

/* element card */
.el{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:11px;overflow:hidden;border-inline-start:5px solid #EBD9CE;box-shadow:0 1px 2px rgba(33,29,26,.04)}
.el.st-ok{border-inline-start-color:var(--ok)}
.el.st-bad{border-inline-start-color:var(--bad)}
.el.st-badu{border-inline-start-color:var(--warn)}
.el.st-badl{border-inline-start-color:#E6A817}
.el.st-partial{border-inline-start-color:var(--gold)}
.el.st-absent{border-inline-start-color:var(--na);opacity:.82}
.el-head{width:100%;display:flex;align-items:center;gap:10px;padding:12px 13px;background:none;border:none;text-align:right}
.el-no{flex:none;min-width:30px;height:30px;padding:0 6px;border-radius:9px;background:var(--gold);color:#fff;font-size:.76rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.el-name{flex:1;min-width:0;font-weight:700;font-size:.95rem;color:var(--navy-2);line-height:1.35}
.el-name small{display:block;font-weight:500;font-size:.72rem;color:var(--muted);margin-top:1px}
.pill{flex:none;font-size:.7rem;font-weight:700;padding:4px 9px;border-radius:20px;background:#F6EEE9;color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.badu{background:var(--warn-soft);color:var(--warn)}
.pill.badl{background:#FEF3D6;color:#A07400}
.pill.partial{background:var(--gold-soft);color:#B5512F}
.pill.absent{background:var(--na-soft);color:var(--na)}
.chev{flex:none;color:var(--gold);transition:transform .2s;font-size:.85rem}
.el.open .chev{transform:rotate(180deg)}
.el-body{display:none;padding:0 13px 14px;border-top:1px solid var(--line)}
.el.open .el-body{display:block}
.el-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0 6px;flex-wrap:wrap}
.sw{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer}
.sw input{width:18px;height:18px;accent-color:var(--navy)}
.okall{border:1.5px solid var(--ok);color:var(--ok);background:var(--ok-soft);font-weight:700;font-size:.78rem;padding:6px 12px;border-radius:20px}
.crit{padding:10px 0;border-bottom:1px dashed var(--line)}
.crit:last-of-type{border-bottom:none}
.crit-label{font-weight:600;font-size:.88rem;margin-bottom:7px;display:flex;gap:7px;align-items:baseline}
.crit-label::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--gold);transform:translateY(-1px)}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.seg button{border:1.5px solid #EBD9CE;background:#fff;border-radius:10px;padding:9px 4px;font-weight:700;font-size:.8rem;color:var(--muted)}
.seg .s-r.on{background:var(--ok);border-color:var(--ok);color:#fff}
.seg .s-n.on{background:var(--bad);border-color:var(--bad);color:#fff}
.seg .s-x.on{background:var(--na);border-color:var(--na);color:#fff}
.imp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;padding:8px 10px;background:#FDF3EE;border-radius:10px}
.imp > span{font-size:.75rem;font-weight:700;color:var(--muted)}
.imp button{border:1.5px solid #EBD9CE;background:#fff;border-radius:20px;padding:5px 11px;font-size:.75rem;font-weight:700;color:var(--muted)}
.imp .i-b.on{background:var(--bad);border-color:var(--bad);color:#fff}
.imp .i-u.on{background:var(--warn);border-color:var(--warn);color:#fff}
.imp .i-l.on{background:#E6A817;border-color:#E6A817;color:#fff}
.imp .need{color:var(--bad);font-size:.72rem;font-weight:700}
.qty{display:grid;grid-template-columns:84px 1fr 1fr;gap:8px;margin-top:10px}
.qty label{display:block;font-size:.78rem;font-weight:700;color:var(--navy-2);margin-bottom:4px}
.qty select,.qty input{width:100%;padding:8px 10px;border:1px solid #EBD9CE;border-radius:10px;background:#fff;font-weight:600;min-width:0}
.note{width:100%;margin-top:10px;padding:9px 11px;border:1px solid #EBD9CE;border-radius:10px;min-height:44px;resize:vertical;background:#FFFDFC;font-size:.85rem}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.ph{position:relative;width:66px;height:66px;border-radius:10px;background-size:cover;background-position:center;border:1px solid var(--line)}
.ph button{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;border:none;background:var(--bad);color:#fff;font-size:.7rem;line-height:22px;padding:0}
.addph{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:66px;padding:0 14px;border:1.5px dashed var(--brown);border-radius:10px;color:var(--brown);font-weight:700;font-size:.78rem;background:#FFF5F0;cursor:pointer}
.addph input{display:none}

/* forms */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:1rem;color:var(--navy-2)}
.field{margin-bottom:12px}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--navy-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid #EBD9CE;border-radius:10px;background:#fff;font-size:.92rem}
.field textarea{min-height:70px;resize:vertical}
.req{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brown);outline-offset:1px}
.hijri{font-size:.78rem;color:var(--brown);font-weight:600;margin-top:4px}
.codechip{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:10px;padding:8px 13px;font-weight:700;font-size:.95rem;direction:ltr}
.codechip small{color:rgba(255,255,255,.85);font-weight:600;font-size:.72rem}
.geo{display:flex;gap:8px}
.geo input{flex:1}
.geo button{flex:none;border:1.5px solid var(--navy);background:#fff;border-radius:10px;padding:0 12px;font-weight:700;font-size:.8rem}
.restore{background:var(--ok-soft);border:1px solid var(--ok);color:#1F6B5A;border-radius:12px;padding:11px 13px;font-size:.83rem;margin-bottom:14px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.restore button{border:1px solid var(--bad);color:var(--bad);background:#fff;border-radius:8px;padding:6px 11px;font-weight:700;font-size:.76rem}
.mapbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mapbox div{background:#FDF5F0;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:.78rem}
.mapbox b{display:block;font-size:.85rem;color:var(--navy-2)}

/* summary */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media (min-width:620px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px}
.kpi .v{font-size:1.7rem;font-weight:700;line-height:1.1;color:var(--navy-2)}
.kpi .l{font-size:.75rem;color:var(--muted);font-weight:600;margin-top:4px}
.kpi.hero{background:var(--navy);border-color:var(--navy);color:#fff}
.kpi.hero .v{color:#fff}
.kpi.hero .l{color:rgba(255,255,255,.9)}
.kpi.b .v{color:var(--bad)}
.secrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:.85rem}
.secrow:last-child{border-bottom:none}
.secrow b{font-weight:700;color:var(--navy-2)}
.secrow .pct{font-weight:700}
.bar{grid-column:1/-1;height:8px;background:#F6E7DE;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.secrow .sub{grid-column:1/-1;font-size:.72rem;color:var(--muted)}
.find{display:block;width:100%;text-align:right;background:#fff;border:1px solid var(--line);border-inline-start:4px solid var(--bad);border-radius:11px;padding:10px 12px;margin-bottom:8px}
.find.u{border-inline-start-color:var(--warn)}
.find.l{border-inline-start-color:#E6A817}
.find.none{border-inline-start-color:var(--muted)}
.find b{font-size:.88rem;color:var(--navy-2)}
.find .where{font-size:.72rem;color:var(--muted);display:block}
.find .what{font-size:.8rem;margin-top:3px}
.grp-title{font-size:.85rem;font-weight:700;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.grp-title .dot{width:10px;height:10px;border-radius:50%}
.warnbox{background:var(--warn-soft);border:1px solid #F5C9A0;color:#9A4B17;border-radius:12px;padding:10px 13px;font-size:.82rem;margin-bottom:12px}
.decs{display:grid;gap:8px}
.dec{display:flex;align-items:center;gap:10px;text-align:right;width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:700;font-size:.95rem}
.dec .ring{width:20px;height:20px;border-radius:50%;border:2px solid #E3CFC3;flex:none}
.dec.on.d-ready{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.dec.on.d-cond{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.dec.on.d-not{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.dec.on .ring{border-color:currentColor;background:currentColor;box-shadow:inset 0 0 0 4px #fff}
.indicator{font-size:.8rem;color:var(--muted);margin:10px 0 0}
.exports{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:13px;border:1.5px solid var(--navy);background:#fff;text-align:right;font-weight:700;font-size:.92rem;color:var(--navy-2)}
.xbtn small{font-weight:500;font-size:.72rem;color:var(--muted)}
.xbtn.primary{background:var(--navy);color:#fff}
.xbtn.primary small{color:rgba(255,255,255,.85)}
.xbtn .ic{font-size:1.2rem}
.xbtn .done{font-size:.7rem;color:var(--ok);font-weight:700}
.xbtn.primary .done{color:#CFF0E5}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tools button,.tools label{border:1px solid #EBD9CE;background:#fff;border-radius:10px;padding:9px 12px;font-weight:600;font-size:.8rem;cursor:pointer}
.tools .danger{color:var(--bad);border-color:#F5BEB3}
.tools input{display:none}

/* bottom bar */
.bottombar{position:fixed;bottom:0;right:0;left:0;z-index:30;background:linear-gradient(180deg,rgba(251,241,231,0),var(--sand) 26%);padding:14px 0 calc(10px + env(safe-area-inset-bottom))}
.bottombar-inner{max-width:760px;margin:0 auto;padding:0 14px;display:flex;gap:10px;align-items:center}
.nb{flex:1;padding:14px;border-radius:13px;font-weight:700;font-size:.95rem;border:1.5px solid var(--navy);background:#fff;color:var(--navy)}
.nb.primary{background:var(--navy);color:#fff}
.nb:disabled{opacity:.3}
.saved{position:fixed;top:8px;left:10px;z-index:40;font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(62,122,85,.92);color:#fff;opacity:0;transition:opacity .3s;pointer-events:none}
.saved.show{opacity:1}
.saved.warn{background:rgba(183,121,31,.95)}
.saved.err{background:rgba(162,62,50,.95)}

.toast{position:fixed;bottom:96px;right:50%;transform:translateX(50%);z-index:60;background:var(--navy-2);color:#fff;padding:11px 17px;border-radius:11px;font-size:.85rem;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast.err{background:var(--bad)}

.overlay{position:fixed;inset:0;z-index:100;background:rgba(20,17,16,.6);display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media (min-width:700px){.sheet{border-radius:20px}}
.sheet h3{margin:0 0 6px;font-size:1.08rem}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:.85rem}
.mbtns{display:grid;gap:9px}
.mbtn{display:block;text-align:center;text-decoration:none;padding:13px;border-radius:12px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;font-size:.92rem}
.mbtn.primary{background:var(--navy);color:#fff}
.mbtn.danger{border-color:var(--bad);color:var(--bad)}
.busy{position:fixed;inset:0;z-index:200;background:rgba(251,241,231,.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:700;color:var(--navy-2)}
.busy.show{display:flex}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--gold-soft);border-top-color:var(--brown);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
pre.code{direction:ltr;text-align:left;background:#FDF3EE;border-radius:10px;padding:10px;font-size:.72rem;overflow:auto}

/* ============ REPORT (PDF) ============ */
#pdfHost{position:absolute;top:0;left:0;width:794px;z-index:150;pointer-events:none}
.rp-measure{width:714px;font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;direction:rtl;color:#1B2A2E;font-size:12px;line-height:1.55}
.rp-page{width:794px;height:1123px;background:#fff;position:relative;overflow:hidden;font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;direction:rtl;color:#1B2A2E;font-size:12px;line-height:1.55;margin-bottom:20px}
.rp-top{height:58px;background:#211D1A;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 40px}
.rp-top img{height:32px;border-radius:4px}
.rp-top .t{font-size:12.5px;font-weight:700}
.rp-top .t small{display:block;font-size:10px;color:#E9D8C6;font-weight:500}
.rp-gold{height:4px;background:#E8985F}
.rp-body{padding:24px 40px 0}
.rp-foot{position:absolute;bottom:0;left:0;right:0;height:46px;border-top:1px solid #E9D9C8;display:flex;align-items:center;justify-content:space-between;padding:0 40px;font-size:10px;color:#6B7A7D}
.rp-block{padding-bottom:10px}
.rp-h2{font-size:17px;font-weight:700;color:#141110;border-bottom:2px solid #E8985F;padding-bottom:5px;margin-top:6px}
.rp-h3{font-size:13px;font-weight:700;color:#fff;background:#8B5A3C;border-radius:6px;padding:5px 12px;margin-top:6px}
.rp-kpis{display:flex;gap:10px}
.rp-kpi{flex:1;border:1px solid #E9D9C8;border-radius:10px;padding:10px 12px;background:#FBF6F0}
.rp-kpi .v{font-size:22px;font-weight:700;line-height:1.2;color:#141110}
.rp-kpi .l{font-size:10.5px;color:#6B7A7D}
.rp-kpi.dark{background:#211D1A;border-color:#211D1A}
.rp-kpi.dark .v{color:#E8985F}
.rp-kpi.dark .l{color:#E9D8C6}
.rp-kpi.red .v{color:#A23E32}
.rp-table{border:1px solid #E9D9C8;border-radius:8px;overflow:hidden}
.rp-tr{display:flex;align-items:center;border-bottom:1px solid #EFE5DA;min-height:30px}
.rp-tr:last-child{border-bottom:none}
.rp-tr.h{background:#211D1A;color:#fff;font-weight:700;font-size:11px}
.rp-tr > div{padding:5px 8px}
.rp-tr .c1{flex:2.2;font-weight:700}
.rp-tr .cn{flex:1;text-align:center}
.rp-tr .cb{flex:2;display:flex;align-items:center;gap:6px}
.rp-bar{flex:1;height:7px;background:#EEE5DB;border-radius:5px;overflow:hidden}
.rp-bar i{display:block;height:100%}
.rp-find{border:1px solid #E9D9C8;border-right:5px solid #A23E32;border-radius:8px;padding:9px 12px;background:#fff}
.rp-find.u{border-right-color:#B7791F}
.rp-find.l{border-right-color:#E6A817}
.rp-find.none{border-right-color:#8A8F91}
.rp-find .fh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rp-find .fh b{font-size:12.5px}
.rp-find .where{font-size:10px;color:#6B7A7D}
.rp-find ul{margin:5px 0 0;padding:0 6px 0 0;list-style:none}
.rp-find li{margin:1px 0}
.rp-find li:before{content:"– ";color:#8A8F91}
.rp-note{font-size:11px;background:#FBF6F0;border-radius:6px;padding:5px 9px;margin-top:6px;color:#4A3B30}
.rp-tag{font-size:10px;font-weight:700;color:#fff;background:#A23E32;border-radius:12px;padding:1px 9px}
.rp-tag.u{background:#B7791F}.rp-tag.l{background:#E6A817}.rp-tag.none{background:#8A8F91}
.rp-phs{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.rp-ph{width:150px;height:110px;border-radius:6px;background-size:cover;background-position:center;border:1px solid #E9D9C8}
.rp-row{display:flex;flex-wrap:wrap;gap:4px 8px;border-bottom:1px solid #EFE5DA;padding:6px 2px;align-items:flex-start}
.rp-row .no{flex:none;width:26px;height:20px;border-radius:5px;background:#211D1A;color:#fff;font-size:10px;font-weight:700;text-align:center;line-height:20px}
.rp-row .nm{flex:none;width:170px;font-weight:700;font-size:11.5px;line-height:1.35}
.rp-row .nm small{display:block;font-weight:500;color:#6B7A7D;font-size:9.5px}
.rp-row .cr{flex:1 1 0;min-width:0;display:flex;flex-wrap:wrap;gap:4px}
.ck{font-size:10.5px;border-radius:5px;padding:1px 7px;border:1px solid #E1D6CA;background:#fff;color:#6B7A7D}
.ck.r{background:#E1EEE3;border-color:#C5DDCB;color:#2E6143}
.ck.n{background:#F5E1DD;border-color:#E9C3BC;color:#8E3328;font-weight:700}
.ck.x{background:#EEF0F0;border-color:#DDE1E1;color:#7A7F81}
.rp-row .rn{flex-basis:100%;margin-right:34px;font-size:10.5px;color:#4A3B30}
.rp-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}
.rp-meta div{border-bottom:1px solid #EFE5DA;padding:4px 0;font-size:11.5px}
.rp-meta span{display:block;font-size:9.5px;color:#6B7A7D}
.rp-dec{border-radius:12px;padding:14px 18px;color:#fff;font-size:18px;font-weight:700;text-align:center}
.rp-dec.d-ready{background:#3E7A55}.rp-dec.d-cond{background:#B7791F}.rp-dec.d-not{background:#A23E32}.rp-dec.d-none{background:#8A8F91}
.rp-qr{display:flex;align-items:center;gap:16px;margin-top:18px;border:1px solid #E9D9C8;border-radius:10px;padding:10px 14px;background:#FBF6F0}
.rp-qr img{width:104px;height:104px;image-rendering:pixelated;background:#fff;border-radius:6px}
.rp-qr b{display:block;font-size:13px;color:#141110}.rp-qr span{font-size:10.5px;color:#6B7A7D}
.rp-sign{display:flex;gap:14px}
.rp-sign div{flex:1;border:1px dashed #CDBFAE;border-radius:8px;padding:10px 12px;min-height:74px;font-size:11px}
.rp-sign span{display:block;font-size:9.5px;color:#6B7A7D;margin-bottom:4px}
/* cover */
.cv-top{height:470px;background:#211D1A;color:#fff;padding:52px 56px 0;position:relative}
.cv-top img{height:70px;border-radius:6px}
.cv-label{margin-top:46px;font-size:13px;color:#E8985F;font-weight:700}
.cv-title{font-size:30px;font-weight:700;line-height:1.35;margin-top:6px}
.cv-mosque{font-size:22px;font-weight:600;color:#F6DEC7;margin-top:18px;line-height:1.4}
.cv-code{display:inline-block;margin-top:14px;background:#E8985F;color:#141110;font-weight:700;font-size:15px;border-radius:8px;padding:4px 14px;direction:ltr}
.cv-band{height:10px;background:#E8985F}
.cv-body{padding:30px 56px 0}
/* ============ SLIDES (PDF 16:9) ============ */
.sl{width:1280px;height:720px;position:relative;overflow:hidden;background:#fff;font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;direction:rtl;color:#1B2A2E;font-size:15px;line-height:1.6;margin-bottom:20px}
.sl-measure{width:1168px;font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;direction:rtl;color:#1B2A2E;font-size:15px;line-height:1.6}
.sl-hd{position:absolute;top:0;left:0;right:0;height:80px;background:#211D1A;display:flex;align-items:center;justify-content:space-between;padding:0 56px;color:#fff}
.sl-hd .t{font-size:25px;font-weight:700;line-height:1.3}
.sl-hd .t small{display:block;font-size:12.5px;color:#E8985F;font-weight:600;margin-top:2px}
.sl-hd img{height:42px}
.sl-gold{position:absolute;top:80px;left:0;right:0;height:5px;background:#E8985F}
.sl-bd{position:absolute;top:112px;left:56px;right:56px;bottom:62px}
.sl-ft{position:absolute;bottom:0;left:0;right:0;height:46px;border-top:1px solid #E9D9C8;display:flex;justify-content:space-between;align-items:center;padding:0 56px;font-size:12px;color:#6B7A7D}
/* cover */
.slc-r{position:absolute;top:0;bottom:0;right:0;width:780px;background:#211D1A;color:#fff;padding:64px 70px 0}
.slc-r img{height:74px}
.slc-k{margin-top:70px;font-size:17px;color:#E8985F;font-weight:700}
.slc-t{font-size:58px;font-weight:700;line-height:1.25;margin-top:6px}
.slc-m{font-size:28px;font-weight:600;color:#F6DEC7;margin-top:22px;line-height:1.4}
.slc-c{display:inline-block;margin-top:16px;background:#E8985F;color:#141110;font-weight:700;font-size:18px;border-radius:8px;padding:4px 16px;direction:ltr}
.slc-band{position:absolute;top:0;bottom:0;right:780px;width:12px;background:#E8985F}
.slc-l{position:absolute;top:0;bottom:0;left:0;width:488px;background:#FBF6F0;padding:52px 44px 0}
.slc-meta div{border-bottom:1px solid #E9D9C8;padding:7px 0;font-size:14px;line-height:1.5}
.slc-meta span{display:block;font-size:11px;color:#6B7A7D}
.slc-dec{margin-top:20px;border-radius:12px;padding:12px 16px;color:#fff;font-size:20px;font-weight:700;text-align:center}
.slc-qr{display:flex;align-items:center;gap:14px;margin-top:16px}
.slc-qr img{width:96px;height:96px;image-rendering:pixelated;background:#fff;border-radius:6px;border:1px solid #E9D9C8}
.slc-qr b{display:block;font-size:13px}.slc-qr span{font-size:11px;color:#6B7A7D}
/* data slide */
.sdat{border:1px solid #E9D9C8;border-radius:12px;overflow:hidden}
.sdat .r{display:flex;align-items:center;min-height:46px;border-bottom:1px solid #EFE5DA;font-size:18px}
.sdat .r:last-child{border-bottom:none}
.sdat .r span{flex:none;width:260px;align-self:stretch;display:flex;align-items:center;padding:0 20px;background:#FBF6F0;color:#8B5A3C;font-size:15px;font-weight:600}
.sdat .r b{padding:0 20px;font-weight:600}
/* summary */
.sls{display:flex;gap:24px;height:100%}
.sls-k{flex:none;width:400px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.sk{border:1px solid #E9D9C8;border-radius:14px;padding:14px 16px;background:#FBF6F0}
.sk .v{font-size:34px;font-weight:700;line-height:1.15;color:#141110}
.sk .l{font-size:12.5px;color:#6B7A7D;margin-top:2px}
.sk.dark{background:#211D1A;border-color:#211D1A}.sk.dark .v{color:#E8985F}.sk.dark .l{color:#E9D8C6}
.sk.red .v{color:#A23E32}
.sk.wide{grid-column:1/-1}
.sl-dec{border-radius:12px;padding:14px 18px;color:#fff;font-size:21px;font-weight:700;text-align:center}
.d-ready{background:#3E7A55}.d-cond{background:#B7791F}.d-not{background:#A23E32}.d-none{background:#8A8F91}
.sls-t{flex:1;min-width:0}
.st{border:1px solid #E9D9C8;border-radius:10px;overflow:hidden}
.st-r{display:flex;align-items:center;min-height:44px;border-bottom:1px solid #EFE5DA;font-size:14px}
.st-r:last-child{border-bottom:none}
.st-r.h{background:#211D1A;color:#fff;font-weight:700;font-size:13px;min-height:40px}
.st-r.tot{background:#FBF6F0;font-weight:700}
.st-r > div{padding:6px 12px}
.st-r .c1{flex:2.2;font-weight:700}.st-r .cn{flex:1;text-align:center}
.st-r .cb{flex:2.4;display:flex;align-items:center;gap:10px}
.sbar{flex:1;height:9px;background:#EEE5DB;border-radius:6px;overflow:hidden}.sbar i{display:block;height:100%}
/* findings */
.sf-grid{display:flex;gap:20px;align-items:flex-start}
.sf-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.sf{border:1px solid #E9D9C8;border-right:7px solid #A23E32;border-radius:12px;padding:14px 20px;background:#fff}
.sf .fh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sf .fh b{font-size:19px}
.sf .where{font-size:13.5px;color:#6B7A7D}
.sf ul{margin:6px 0 0;padding:0;list-style:none;font-size:16.5px}
.sf li:before{content:"– ";color:#8A8F91}
.sf .nt{font-size:15px;background:#FBF6F0;border-radius:6px;padding:5px 10px;margin-top:6px;color:#4A3B30}
.sf .sp{font-size:14px;color:#8B5A3C;font-weight:600;margin-top:4px}
.tg{font-size:13px;font-weight:700;color:#fff;border-radius:12px;padding:1px 10px}
/* photos */
.sp-grid{display:flex;gap:22px;height:100%}
.sp-grid > div{flex:1;min-width:0;display:flex;flex-direction:column}
.sp-grid .im{flex:1;border-radius:10px;background-size:cover;background-position:center;background-color:#F2ECE6}
.sp-grid .cap{font-size:13.5px;line-height:1.6;padding:10px 4px 0;min-height:70px}
.sp-grid .cap b{color:#8B5A3C;margin-left:6px}
/* decision */
.sd-reason{margin-top:18px;background:#FBF6F0;border-radius:12px;padding:16px 20px;font-size:16px;line-height:1.9}
.sd-sign{display:flex;gap:16px;margin-top:22px}
.sd-sign div{flex:1;border:1px dashed #CDBFAE;border-radius:10px;padding:12px 16px;min-height:110px;font-size:15px}
.sd-sign span{display:block;font-size:12px;color:#6B7A7D;margin-bottom:6px}
/* appendix */
.sa-bar{background:#8B5A3C;color:#fff;font-weight:700;font-size:18px;border-radius:8px;padding:8px 18px}
.sa-row{display:flex;gap:16px;padding:10px 4px;border-bottom:1px solid #EFE5DA;align-items:flex-start}
.sa-row .no{flex:none;width:36px;height:30px;border-radius:7px;background:#211D1A;color:#fff;font-size:14px;font-weight:700;text-align:center;line-height:30px}
.sa-row .nm{flex:none;width:300px;font-weight:700;font-size:17px;line-height:1.45}
.sa-row .nm small{display:block;font-weight:500;color:#6B7A7D;font-size:13px}
.sa-row .cr{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:5px}
.sa-row .cr{gap:7px}.sa-row .cr .ck{font-size:14px;padding:2px 10px;border-radius:6px}
.sl-blk{padding-bottom:12px}
/* end */
.sle{background:#211D1A}
.sle img{position:absolute;top:44%;left:50%;height:96px;transform:translate(-50%,-50%)}

const LISTS_KEY = "mosque-readiness-lists-v1";
function getList(key){
  let extra=[]; try{ extra = (JSON.parse(localStorage.getItem(LISTS_KEY)||"{}")[key])||[]; }catch(e){}
  return [...new Set([...BASE_LISTS[key], ...extra])];
}
function addToList(key, val){
  val=(val||"").trim(); if(!val || BASE_LISTS[key].includes(val)) return;
  try{ const all=JSON.parse(localStorage.getItem(LISTS_KEY)||"{}"); all[key]=[...new Set([...(all[key]||[]), val])]; localStorage.setItem(LISTS_KEY, JSON.stringify(all)); }catch(e){}
}
function coordsFrom(u){
  u=String(u||""); let m=u.match(/@(-?\d{1,3}\.\d+),\s*(-?\d{1,3}\.\d+)/)||u.match(/[?&](?:q|query|ll|destination)=(-?\d{1,3}\.\d+)(?:,|%2C)\s*(-?\d{1,3}\.\d+)/i)||u.match(/!3d(-?\d{1,3}\.\d+)!4d(-?\d{1,3}\.\d+)/)||u.match(/^\s*(-?\d{1,3}\.\d+)\s*[,،]\s*(-?\d{1,3}\.\d+)\s*$/);
  return m ? [m[1], m[2]] : null;
}
function mapLink(){
  const m=state.meta, u=(m.mapUrl||"").trim();
  if(u){ if(/^-?\d{1,3}\.\d+\s*[,،]\s*-?\d{1,3}\.\d+$/.test(u)){ const c=coordsFrom(u); return `https://www.google.com/maps?q=${c[0]},${c[1]}`; } return u; }
  return m.lat&&m.lng ? `https://www.google.com/maps?q=${m.lat},${m.lng}` : "";
}
function qrData(text){
  if(!text || !window.qrcode) return "";
  try{ const q=qrcode(0,"M"); q.addData(text); q.make(); return q.createDataURL(8,2); }catch(e){ return ""; }
}
function hijri(d){
  if(!d) return "";
  try{ return new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}).format(new Date(d+"T00:00:00Z")); }catch(e){ return ""; }
}
function dateBoth(d){ const h=hijri(d); return d ? d+" م"+(h?" — "+h:"") : ""; }
function pickHTML(key,label,newLabel,placeholder){
  const m=state.meta, list=getList(key), isNew = m[key+"New"] || (m[key] && !list.includes(m[key]));
  return `<div class="field"><label>${label}</label>
    <select data-pick="${key}"><option value="">— اختر —</option>${list.map(x=>`<option value="${esc(x)}" ${!isNew&&m[key]===x?"selected":""}>${esc(x)}</option>`).join("")}<option value="__new" ${isNew?"selected":""}>＋ ${newLabel}</option></select>
    ${isNew?`<input data-m="${key}" data-addlist="${key}" value="${esc(m[key])}" placeholder="${placeholder}" style="margin-top:8px">`:""}</div>`;
}

/* الصور تُحفظ في IndexedDB (سعة كبيرة)، والبيانات النصية في localStorage أيضًا كنسخة ثانية */
const IDB_NAME="mosque-readiness-db", IDB_STORE="kv";
let idbP=null;
function idb(){
  if(idbP) return idbP;
  idbP = new Promise((res,rej)=>{ try{ const r=indexedDB.open(IDB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } });
  return idbP;
}
async function idbPut(k,v){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction(IDB_STORE,"readwrite"); t.objectStore(IDB_STORE).put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
async function idbGet(k){ const db=await idb(); return new Promise((res,rej)=>{ const r=db.transaction(IDB_STORE,"readonly").objectStore(IDB_STORE).get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbDel(k){ const db=await idb(); return new Promise(res=>{ const t=db.transaction(IDB_STORE,"readwrite"); t.objectStore(IDB_STORE).delete(k); t.oncomplete=()=>res(); t.onerror=()=>res(); }); }
function photoCount(st){ let n=0; Object.values((st&&st.items)||{}).forEach(i=>n+=(i.ph||[]).length); return n; }
let storeReady=false;
async function saveNow(){
  if(!storeReady) return;
  state.updated = new Date().toISOString();
  const snap = JSON.parse(JSON.stringify(state));
  let lsOk=false, idbOk=false;
  try{ const lite=JSON.parse(JSON.stringify(snap)); Object.values(lite.items).forEach(i=>i.ph=[]); localStorage.setItem(STORE_KEY, JSON.stringify(lite)); lsOk=true; }catch(e){}
  try{ await idbPut("state", snap); idbOk=true; }catch(e){}
  if(idbOk) savedBadge("محفوظ تلقائيًا ✓");
  else if(lsOk) savedBadge(photoCount(snap)?"حُفظت البيانات، وتعذّر حفظ الصور — نزّلها الآن من «تنزيل جميع الصور»":"محفوظ تلقائيًا ✓", photoCount(snap)?"warn":"");
  else savedBadge("تعذّر الحفظ التلقائي — احفظ نسخة احتياطية الآن", "err");
}
function adopt(d){
  const base = freshState();
  state = Object.assign(base, d, { meta:Object.assign(base.meta,d.meta||{}), decision:Object.assign(base.decision,d.decision||{}), exp:Object.assign(base.exp,d.exp||{}) });
  if(!state.meta.evaluator) state.meta.evaluator = base.meta.evaluator;
  if(!state.meta.evaluatorOrg) state.meta.evaluatorOrg = base.meta.evaluatorOrg;
  restored = true;
}
async function loadSaved(){
  let ls=null, db=null;
  try{ const raw=localStorage.getItem(STORE_KEY); if(raw){ const d=JSON.parse(raw); if(d&&d.v===1) ls=d; } }catch(e){}
  try{ const d=await idbGet("state"); if(d&&d.v===1) db=d; }catch(e){}
  let pick = db && (!ls || (db.updated||"")>=(ls.updated||"")) ? db : ls;
  if(pick && db && pick===ls && db.id===ls.id){
    Object.entries(db.items||{}).forEach(([k,it])=>{ if(it.ph&&it.ph.length){ const t=pick.items[k]||(pick.items[k]={a:false,c:{},note:"",ph:[]}); if(!t.ph||!t.ph.length) t.ph=it.ph; } });
  }
  if(pick) adopt(pick);
  storeReady=true;
  if(ls && photoCount(ls)) saveNow();   /* ترحيل الصور القديمة من localStorage إلى IndexedDB */
}

/* ---------------- الإحصاءات ---------------- */
function elStats(el){
  const it = peek(el.k);
  const s = { absent:false, total:el.crit.length, done:0, r:0, n:0, x:0, imp:{b:0,u:0,l:0,none:0}, sev:null };
  if(it && it.a){ s.absent=true; s.total=0; return s; }
  el.crit.forEach((_,i)=>{
    const c = it && it.c[i]; if(!c || !c.s) return;
    s.done++;
    if(c.s==="r") s.r++; else if(c.s==="x") s.x++;
    else { s.n++; const im = IMPACT[c.i] ? c.i : "none"; s.imp[im]++; if(!s.sev || IMPACT[im].rank>IMPACT[s.sev].rank) s.sev=im; }
  });
  return s;
}
function agg(els){
  const a = { els:0, absent:0, total:0, done:0, r:0, n:0, x:0, b:0, u:0, l:0, none:0 };
  els.forEach(el=>{ const s=elStats(el); a.els++; if(s.absent){a.absent++;return;}
    a.total+=s.total; a.done+=s.done; a.r+=s.r; a.n+=s.n; a.x+=s.x; a.b+=s.imp.b; a.u+=s.imp.u; a.l+=s.imp.l; a.none+=s.imp.none; });
  a.readiness = pct(a.r, a.r+a.n);
  a.completion = a.total ? pct(a.done, a.total) : (a.els? 100 : 0);
  return a;
}
function computeAll(){
  const per = MAINS.map(m=>Object.assign({ main:m }, agg(ELS.filter(e=>e.main===m))));
  const tot = agg(ELS);
  const findings = [];
  ELS.forEach(el=>{ const s=elStats(el); if(s.n>0) findings.push({ el, s }); });
  findings.sort((a,b)=>IMPACT[b.s.sev].rank-IMPACT[a.s.sev].rank);
  return { per, tot, findings };
}
function elStatus(el){
  const s = elStats(el);
  if(s.absent) return { cls:"absent", pill:"غير موجود" };
  if(s.done===0) return { cls:"none", pill:"لم يُقيَّم" };
  if(s.n>0){ const c = s.sev==="b"?"bad":s.sev==="u"?"badu":s.sev==="l"?"badl":"bad"; return { cls:c, pill:"غير جاهز · "+IMPACT[s.sev].short }; }
  if(s.done<s.total) return { cls:"partial", pill:s.done+" / "+s.total };
  return { cls:"ok", pill:"جاهز ✓" };
}

  return `<div class="el st-${st.cls} ${open?"open":""}" data-card="${el.k}">

      <span class="el-no">${esc(el.no)}</span>

        <div><label>النوع</label><input data-ty="${el.k}" value="${esc(it.ty)}"></div>

      <textarea class="note" data-note="${el.k}" placeholder="ملاحظة (اختياري)">${esc(it.note)}</textarea>
      <div class="photos">${phs}

      </div>

function rerenderCard(k){
  const el = ELMAP[k], node = document.querySelector(`[data-card="${CSS.escape(k)}"]`);

  const st = STEPS[state.step];
  if(st.type==="page"){ const meta = $("#body .page-meta"); if(meta) meta.innerHTML = pageMetaHTML(st); }

function pageMetaHTML(st){
  const a=agg(st.els);
  return `<span>${a.done} / ${a.total} بند مُقيَّم</span>${a.b?`<span class="mini b">${a.b} مانع</span>`:""}${a.u?`<span class="mini u">${a.u} عاجل</span>`:""}${a.done<a.total?`<button class="linkbtn" data-act="pageok">تعيين غير المُقيَّم: جاهز</button>`:""}`;

/* ---------------- الأحداث ---------------- */
document.addEventListener("click", async e=>{
  const t = e.target.closest("[data-act]"); if(!t) return;
  const act=t.dataset.act, k=t.dataset.k;
  switch(act){
    case "prev": go(state.step-1); break;
    case "next":
      if(state.step===0){
        const m=state.meta;
        if(!m.mosque){ toast("اختر المسجد أولًا", true); return; }
        if(m.mosque==="new" && (!m.name || !m.region)){ toast("أدخل اسم المسجد ومنطقته", true); return; }
        if(!m.evaluator){ toast("أدخل اسم المقيّم", true); return; }
      }
      go(state.step+1); break;
    case "goto": go(+t.dataset.i, k); break;
    case "toggle": { const el=ELMAP[k]; openState[k]=!isOpen(el); rerenderCard(k); break; }
    case "st": {
      const it=item(k), c=+t.dataset.c, v=t.dataset.v; const cur=it.c[c]||{};
      it.c[c] = cur.s===v ? {} : { s:v, i: v==="n" ? cur.i : undefined };
      openState[k]=true; save(); rerenderCard(k); break; }
    case "imp": { const it=item(k), c=+t.dataset.c; it.c[c].i = it.c[c].i===t.dataset.v ? undefined : t.dataset.v; save(); rerenderCard(k); break; }
    case "allok": { const it=item(k); ELMAP[k].crit.forEach((_,i)=>{ if(!it.c[i]||!it.c[i].s) it.c[i]={s:"r"}; }); openState[k]=false; save(); rerenderCard(k); break; }
    case "pageok": {
      const st=STEPS[state.step];
      openSheet(`<h3>تعيين البنود غير المُقيَّمة: جاهز؟</h3><p>سيُعيَّن كل بند لم يُقيَّم في صفحة «${esc(st.title)}» كـ «جاهز». البنود التي قيّمتها لن تتغير.</p>
        <div class="mbtns"><button class="mbtn primary" data-act="pageok-yes">نعم، عيّنها جاهز</button><button class="mbtn" data-act="close">إلغاء</button></div>`); break; }
    case "pageok-yes": {
      STEPS[state.step].els.forEach(el=>{ const it=item(el.k); if(it.a) return; el.crit.forEach((_,i)=>{ if(!it.c[i]||!it.c[i].s) it.c[i]={s:"r"}; }); delete openState[el.k]; });
      closeSheet(); save(); render(); break; }
    case "close": closeSheet(); break;
    case "delph": { const it=item(k); it.ph.splice(+t.dataset.i,1); save(); rerenderCard(k); break; }
    case "dec": state.decision.value = state.decision.value===t.dataset.v ? "" : t.dataset.v; save(); render(); break;
    case "geo":
      if(!navigator.geolocation){ toast("الجهاز لا يدعم تحديد الموقع", true); return; }
      t.textContent="…";
      navigator.geolocation.getCurrentPosition(p=>{ state.meta.lat=p.coords.latitude.toFixed(6); state.meta.lng=p.coords.longitude.toFixed(6); state.meta.mapUrl=`https://www.google.com/maps?q=${state.meta.lat},${state.meta.lng}`; save(); render(); toast("تم تحديد الموقع ✓"); },
        ()=>{ t.textContent="📍 موقعي"; toast("تعذّر تحديد الموقع — تأكد من السماح بالوصول", true); }, { enableHighAccuracy:true, timeout:15000 });
      break;
    case "pdf": exportPDF(); break;
    case "pptx": exportPPTX(); break;
    case "xlsx": exportXLSX(); break;
    case "sheets": sendSheets(); break;
    case "backup": exportBackup(); break;
    case "photos": downloadAllPhotos(); break;
    case "ios-save": iosSave(); break;
    case "ios-skip": pendingSaves=[]; closeSheet(); break;
    case "new": confirmNew(); break;
    case "new-backup": exportBackup(); break;
    case "new-yes": try{ localStorage.removeItem(STORE_KEY); }catch(_){} idbDel("state").catch(()=>{}); state=freshState(); restored=false; for(const x in openState) delete openState[x]; closeSheet(); render(); window.scrollTo(0,0); toast("بدأ تقييم جديد"); break;
    case "share": shareCurrent(); break;
  }
});
document.addEventListener("change", async e=>{
  const t=e.target;
  if(t.matches("[data-nav]")) go(+t.value);
  else if(t.dataset.absent){ const k=t.dataset.absent; item(k).a=t.checked; openState[k]=!t.checked; save(); rerenderCard(k); }
  else if(t.dataset.m==="mosque" || t.dataset.m==="region"){
    state.meta[t.dataset.m]=t.value;
    if(t.dataset.m==="mosque"){ const x=MOSQUES.find(q=>q.no===t.value); state.meta.district = x ? x.district : ""; }
    save(); render(); }
  else if(t.dataset.pick){ const k=t.dataset.pick;
    if(t.value==="__new"){ state.meta[k+"New"]=true; state.meta[k]=""; } else { state.meta[k+"New"]=false; state.meta[k]=t.value; }
    save(); render(); if(t.value==="__new"){ const i=document.querySelector(`[data-addlist="${k}"]`); if(i) i.focus(); } }
  else if(t.dataset.qty){ item(t.dataset.qty).q = t.value; save(); }
  else if(t.dataset.addlist){ addToList(t.dataset.addlist, t.value); }
  else if(t.dataset.photo){
    const k=t.dataset.photo, it=item(k), files=[...t.files].slice(0, 4-it.ph.length), fresh=[];
    for(const f of files){ try{ it.ph.push(await compressImage(f)); if(Date.now()-(f.lastModified||0) < 3*60*1000) fresh.push(new File([f], photoName(ELMAP[k], it.ph.length, f), { type:f.type||"image/jpeg" })); }catch(err){ toast("تعذّرت قراءة الصورة", true); } }
    openState[k]=true; save(); rerenderCard(k);
    if(fresh.length && autoSaveOn()) saveToDevice(fresh);
  }
  else if(t.matches("[data-import]")) importBackup(t.files[0]);
  else if(t.matches("[data-autosave]")){ try{ localStorage.setItem(AUTOSAVE_KEY, t.checked?"1":"0"); }catch(_){} toast(t.checked?"حفظ الصور في الجوال: مفعّل":"حفظ الصور في الجوال: متوقف"); }
});
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.dataset.note){ item(t.dataset.note).note=t.value; save(); }
  else if(t.dataset.ty){ item(t.dataset.ty).ty=t.value; save(); }
  else if(t.dataset.br){ item(t.dataset.br).br=t.value; save(); }
  else if(t.dataset.m && t.dataset.m!=="mosque" && t.dataset.m!=="region"){
    if(t.dataset.m==="mapUrl"){ state.meta.mapUrl=t.value.trim(); const c=coordsFrom(state.meta.mapUrl); state.meta.lat=c?c[0]:""; state.meta.lng=c?c[1]:""; }
    else state.meta[t.dataset.m]=t.value;
    if(t.dataset.m==="date"){ const h=$("#hijriOut"); if(h) h.textContent = hijri(t.value); }
    save();
  }
  else if(t.dataset.d){ state.decision[t.dataset.d]=t.value; save(); }
});

function confirmNew(){
  const anyExport = state.exp.pdf||state.exp.xlsx||state.exp.sheets;

    <div class="mbtns"><button class="mbtn primary" data-act="new-backup">💾 حفظ نسخة احتياطية أولًا</button>

/* ---------------- الصور ---------------- */
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const AUTOSAVE_KEY = "mosque-readiness-autosave";
function autoSaveOn(){ try{ return localStorage.getItem(AUTOSAVE_KEY)!=="0"; }catch(_){ return true; } }
const safeName = s => String(s||"").replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g," ").trim();
function photoName(el, n, f){
  const ext = ((f&&f.name||"").match(/\.(jpe?g|png|heic|heif|webp)$/i)||[".jpg"])[0].toLowerCase();
  return safeName(`${mosqueCode()||"مسجد"}_${el.main}_${el.no}-${el.name}_${n}`)+ext;
}
let pendingSaves=[];
function saveToDevice(files){
  if(IS_IOS){
    pendingSaves = pendingSaves.concat(files);
    let can=false; try{ can = !!(navigator.canShare && navigator.canShare({ files:pendingSaves })); }catch(_){}
    openSheet(`<h3>حفظ ${pendingSaves.length===1?"الصورة":"الصور ("+pendingSaves.length+")"} في الجوال</h3>
      <p>${can?"اضغط الزر ثم اختر «حفظ الصورة» / Save Image.":"اضغط مطولًا على الرابط ثم اختر الحفظ."}</p>
      <div class="mbtns">${can?`<button class="mbtn primary" data-act="ios-save">📥 حفظ في الصور</button>`:pendingSaves.map(f=>`<a class="mbtn" href="${URL.createObjectURL(f)}" download="${esc(f.name)}">${esc(f.name)}</a>`).join("")}
      <button class="mbtn" data-act="ios-skip">لاحقًا</button></div>`);
    return;
  }
  files.forEach((f,i)=>setTimeout(()=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000); }, i*400));

function compressImage(file, max=1600, q=0.82){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ let w=img.naturalWidth,h=img.naturalHeight; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h); URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg",q)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(); }; img.src=url;
  });
}

function slFoot(n,total){ return `<div class="sl-ft"><span>${ORG}</span><span>${n} / ${total}</span></div>`; }
function slSlide(title, body){ return { title, body }; }
function measureH(host, htmlArr, width){
  host.innerHTML = `<div class="sl-measure" style="width:${width}px">${htmlArr.map(h=>`<div class="sl-blk">${h}</div>`).join("")}</div>`;
  return [...host.firstChild.children].map(n=>n.getBoundingClientRect().height);
}
function findingCard(el, g){
  const it=peek(el.k);
  const bad=el.crit.map((c,i)=>{ const v=it.c[i]; return v&&v.s==="n" ? `<li>${esc(c)} <span style="color:${IMPACT[v.i||"none"].color};font-weight:700">(${IMPACT[v.i||"none"].label})</span></li>` : ""; }).join("");
  return `<div class="sf" style="border-right-color:${IMPACT[g].color}"><div class="fh"><span class="tg" style="background:${IMPACT[g].color}">${IMPACT[g].short}</span><b>${esc(el.no)}. ${esc(el.name)}</b><span class="where">${esc(el.main)} › ${esc(el.title)}</span></div>
    <ul>${bad}</ul>${specs(it)?`<div class="sp">${specs(it)}</div>`:""}${it.note?`<div class="nt">${esc(it.note)}</div>`:""}</div>`;
}
function buildSlides(host){
  const { per, tot, findings } = computeAll(), d=state.decision, m=state.meta, info=mosqueInfo();
  const S=[]; const decCls=d.value?DECISIONS[d.value].cls:"d-none", decTxt=d.value?DECISIONS[d.value].label:"لم يُعتمد القرار بعد (مسودة)";
  /* cover */
  const meta=[["المدينة / المنطقة",[info.city,REGION_NAMES[info.region]].filter(Boolean).join(" — ")],["الحي / الموقع",m.district],["تاريخ التقييم",dateBoth(m.date)],["المقيّم",m.evaluator],["جهة المقيّم",m.evaluatorOrg],["المقاول المنفّذ",m.contractor],["الاستشاري / المشرف",m.supervisor]];
  const qr=qrData(mapLink());
  S.push({ raw:`<div class="sl"><div class="slc-r" style="width:auto;left:0;padding:70px 90px 0"><img src="${LOGO}" style="height:84px"><div class="slc-k" style="margin-top:110px;font-size:20px">تقرير تقييم</div><div class="slc-t" style="font-size:72px">جاهزية المسجد</div><div class="slc-m" style="font-size:34px">${esc(info.name)}</div>${mosqueCode()?`<div class="slc-c" style="font-size:20px">${esc(mosqueCode())}</div>`:""}</div><div style="position:absolute;left:0;right:0;bottom:0;height:14px;background:#E8985F"></div></div>` });
  /* data slide */
  S.push(slSlide("بيانات المسجد والتقييم", `<div class="sdat">${meta.map(([l,v])=>`<div class="r"><span>${l}</span><b>${esc(v||"—")}</b></div>`).join("")}</div>
    <div style="display:flex;gap:20px;align-items:stretch;margin-top:18px"><div class="sl-dec ${decCls}" style="flex:1;display:flex;align-items:center;justify-content:center;font-size:24px">${decTxt}</div>
    ${qr?`<div class="slc-qr" style="margin:0;border:1px solid #E9D9C8;border-radius:12px;padding:10px 16px;background:#FBF6F0"><img src="${qr}"><div><b>موقع المسجد</b><span>امسح الباركود لفتح الموقع<br>على خرائط Google</span></div></div>`:""}</div>`));
  /* summary */
  S.push(slSlide("ملخص النتائج", `<div class="sls"><div class="sls-k">
      <div class="sk dark"><div class="v">${tot.readiness==null?"—":tot.readiness+"%"}</div><div class="l">نسبة الجاهزية</div></div>
      <div class="sk"><div class="v">${tot.completion||0}%</div><div class="l">اكتمال التقييم (${tot.done}/${tot.total})</div></div>
      <div class="sk red"><div class="v">${tot.b}</div><div class="l">بنود تمنع الافتتاح</div></div>
      <div class="sk"><div class="v">${tot.u} <span style="font-size:20px;color:#6B7A7D">/ ${tot.l}</span></div><div class="l">عاجل / تحسين لاحق</div></div>
      <div class="sk wide" style="padding:0;border:none;background:none"><div class="sl-dec ${decCls}">${decTxt}</div></div></div>
    <div class="sls-t"><div class="st"><div class="st-r h"><div class="c1">القسم</div><div class="cn">المُقيَّم</div><div class="cn">غير جاهز</div><div class="cn">مانع</div><div class="cb">نسبة الجاهزية</div></div>
      ${per.map(p=>`<div class="st-r"><div class="c1">${esc(p.main)}</div><div class="cn">${p.done}/${p.total}</div><div class="cn">${p.n}</div><div class="cn" style="${p.b?"color:#A23E32;font-weight:700":""}">${p.b}</div><div class="cb"><div class="sbar"><i style="width:${p.readiness||0}%;background:${barColor(p.readiness)}"></i></div><b style="width:46px;color:${barColor(p.readiness)}">${p.readiness==null?"—":p.readiness+"%"}</b></div></div>`).join("")}
      <div class="st-r tot"><div class="c1">الإجمالي</div><div class="cn">${tot.done}/${tot.total}</div><div class="cn">${tot.n}</div><div class="cn">${tot.b}</div><div class="cb"><b>${tot.readiness==null?"—":tot.readiness+"%"}</b></div></div></div></div></div>`));
  /* findings: 2-column card slides per impact group */
  ["b","u","l","none"].forEach(g=>{
    const list=findings.filter(f=>f.s.sev===g); if(!list.length) return;
    const cards=list.map(({el})=>findingCard(el,g)), hs=measureH(host, cards, 1168);
    let cur=[], h=0; const pages=[];
    cards.forEach((c,i)=>{ if(h+hs[i]>SL_BODY && cur.length){ pages.push(cur); cur=[]; h=0; } cur.push(c); h+=hs[i]; });
    if(cur.length) pages.push(cur);
    pages.forEach((pc,pi)=>S.push(slSlide(`الملاحظات: ${IMPACT[g].label} (${list.length})${pages.length>1?` — ${pi+1}/${pages.length}`:""}`,
      pc.map(c=>`<div class="sl-blk">${c}</div>`).join(""))));
  });
  if(!findings.length) S.push(slSlide("الملاحظات", `<div class="sd-reason">لم تُرصد بنود غير جاهزة في هذا التقييم.</div>`));
  /* photos: 3 per slide */
  const phs=[]; STEPS.forEach(st=>{ if(st.type!=="page") return; st.els.forEach(el=>{ const it=peek(el.k); if(it&&it.ph&&!it.a) it.ph.forEach(p=>phs.push({p,el,it})); }); });
  for(let i=0;i<phs.length;i+=3){
    const grp=phs.slice(i,i+3);
    S.push(slSlide(`الشواهد المصوّرة${phs.length>3?` — ${Math.floor(i/3)+1}/${Math.ceil(phs.length/3)}`:""}`, `<div class="sp-grid">${grp.map((x,j)=>`<div><div class="im" style="background-image:url('${x.p}')"></div><div class="cap"><b>صورة (${i+j+1})</b>${esc(x.el.no)}. ${esc(x.el.name)} — ${esc(x.el.main)}${x.it.note?`<br><span style="color:#6B7A7D">${esc(x.it.note)}</span>`:""}</div></div>`).join("")}${grp.length<3?"<div></div>".repeat(3-grp.length):""}</div>`));
  }
  /* decision */
  S.push(slSlide("قرار الجاهزية والاعتماد", `<div class="sl-dec ${decCls}" style="font-size:30px;padding:22px">${decTxt}</div>
    ${d.reason?`<div class="sd-reason"><b>المبررات والاشتراطات:</b> ${esc(d.reason)}</div>`:""}
    <div class="sd-sign"><div><span>المعتمد</span>${esc(d.signer||m.evaluator)}</div><div><span>الصفة</span>${esc(d.signerTitle)}</div><div><span>التوقيع</span></div><div><span>التاريخ</span>${esc(m.date)} م<br>${esc(hijri(m.date))}</div></div>`));
  /* appendix */
  const blocks=[];
  STEPS.forEach(st=>{ if(st.type!=="page") return;
    blocks.push({ main:st.main, html:`<div class="sa-bar">${esc(st.main)}${st.main!==st.title?" · "+esc(st.title):""}</div>`, keep:true });
    st.els.forEach(el=>{ const it=peek(el.k);
      blocks.push({ main:st.main, html:`<div class="sa-row"><div class="no">${esc(el.no)}</div><div class="nm">${esc(el.name)}${it&&!it.a&&(it.q||it.ty||it.br)?`<small style="color:#8B5A3C">${specs(it)}</small>`:""}${it&&it.note?`<small>ملاحظة: ${esc(it.note)}</small>`:""}</div><div class="cr">${rpChips(el)}</div></div>` }); });
  });
  const hs=measureH(host, blocks.map(b=>b.html), 1168);
  let cur=[], h=0; const apages=[];
  blocks.forEach((b,i)=>{
    if(h+hs[i]>SL_BODY && cur.length){ let carry=[]; while(cur.length && blocks[cur[cur.length-1]].keep) carry.unshift(cur.pop()); if(!cur.length){ cur=carry; carry=[]; } apages.push(cur); cur=carry; h=carry.reduce((s,j)=>s+hs[j],0); }
    cur.push(i); h+=hs[i];
  });
  if(cur.length) apages.push(cur);
  apages.forEach((pg,pi)=>S.push(slSlide(`ملحق: التقييم التفصيلي — ${pi+1}/${apages.length}`, pg.map(i=>`<div class="sl-blk">${blocks[i].html}</div>`).join(""))));
  /* end */
  S.push({ raw:`<div class="sl sle"><img src="${LOGO}"><div>${ORG}</div></div>` });
  host.innerHTML="";
  return S.map((s,i)=> s.raw ? s.raw : `<div class="sl">${slHead(s.title)}<div class="sl-bd">${s.body}</div>${slFoot(i+1,S.length)}</div>`);
}
async function exportPDF(){
  if(!window.html2canvas || !window.jspdf){ toast("تعذّر تحميل مكتبات التقرير — تحقق من الاتصال", true); return; }
  busy(true, "جاري إعداد العرض…");
  const host=$("#pdfHost");
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    window.scrollTo(0,0);
    host.style.width=SLW+"px";
    const slides=buildSlides(host);
    host.innerHTML=slides.join("");
    const els=[...host.querySelectorAll(".sl")];
    const { jsPDF } = window.jspdf; const pdf=new jsPDF({ orientation:"l", unit:"mm", format:[338.67,190.5], compress:true });
    for(let i=0;i<els.length;i++){
      busy(true, `جاري إنشاء الشريحة ${i+1} من ${els.length}…`);
      await new Promise(r=>setTimeout(r,20));
      const cv=await html2canvas(els[i], { scale:2.5, useCORS:true, backgroundColor:"#ffffff", logging:false, scrollX:0, scrollY:0, windowWidth:1400 });
      if(i) pdf.addPage([338.67,190.5],"l");
      pdf.addImage(cv.toDataURL("image/jpeg",0.95), "JPEG", 0, 0, 338.67, 190.5, undefined, "MEDIUM");
    }
    const blob=pdf.output("blob");
    host.innerHTML=""; host.style.width=""; busy(false);
    state.exp.pdf=true; save();
    if(STEPS[state.step].type==="summary") render();
    deliver(blob, baseName()+".pdf", "عرض PDF");
  }catch(err){ console.error(err); host.innerHTML=""; host.style.width=""; busy(false); toast("حدث خطأ أثناء إنشاء العرض", true); }
}

    { const hdr=["التفاصيل","غير جاهز","جاهز","العنصر","القسم"].map(t=>({ text:t, options:{ bold:true, color:"FFFFFF", fill:{ color:DARK } } }));
      const rows=ELS.map(el=>{ const it=peek(el.k)||{a:false,c:{}}; const s=elStats(el);
        const bad=el.crit.filter((_,i)=>it.c[i]&&it.c[i].s==="n").join("، ");
        const det=it.a?"غير موجود في المسجد":[bad?"غير جاهز: "+bad:"", s.total-s.done?`لم يُقيَّم: ${s.total-s.done}`:"", it.note?"ملاحظة: "+it.note:""].filter(Boolean).join(" — ");
        return [det, it.a?"—":String(s.n), it.a?"—":String(s.r), `${el.no}. ${el.name}`, `${el.main} · ${el.title}`].map((t,ci)=>({ text:t, options: ci===1&&s.n ? { color:"A23E32", bold:true } : {} })); });
      const s=add("ملحق: التقييم التفصيلي");
      s.addTable([hdr, ...rows], { x:0.55, y:1.2, w:12.23, colW:[4.6,0.9,0.8,2.9,3.03], fontFace:F, fontSize:9.5, rtlMode:true, align:"right", valign:"middle", border:{ type:"solid", color:LINE, pt:0.5 },
        autoPage:true, autoPageRepeatHeader:true, autoPageSlideStartY:1.2, newSlideStartY:1.2, masterName:"MAIN" });
    }
    /* end */
    { const s=P.addSlide(); s.background={ color:DARK };
      s.addImage({ data:LOGO, x:5.17, y:2.6, w:3.0, h:1.0, sizing:{ type:"contain", w:3.0, h:1.0 } });
      s.addText(ORG, T({ x:2, y:4.2, w:9.333, h:0.5, fontSize:14, color:"E9D8C6", align:"center" })); }
    const blob=await P.write({ outputType:"blob" });
    busy(false); state.exp.pptx=true; save();
    if(STEPS[state.step].type==="summary") render();
    deliver(blob, baseName()+".pptx", "ملف PowerPoint");
  }catch(err){ console.error(err); busy(false); toast("حدث خطأ أثناء إنشاء ملف PowerPoint", true); }
}
